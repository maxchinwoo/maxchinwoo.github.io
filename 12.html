<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
  <title>📷 카메라로 사진 찍기 (모바일/PC)</title>
  <style>
    :root{
      --bg:#0b0f14; --card:#101725; --pri:#4ea1ff; --txt:#e8f1ff; --sub:#a7bed3; --warn:#ff6b6b;
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
    html,body{margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;}
    .wrap{max-width:900px; margin:0 auto; padding:16px;}
    h1{font-size:1.4rem; margin:8px 0 12px; text-align:center}
    .card{background:var(--card); border-radius:16px; padding:12px; box-shadow:0 8px 24px rgb(0 0 0 / 0.25);}
    .grid{display:grid; gap:12px;}
    .videoBox{position:relative; border-radius:12px; overflow:hidden; background:#000;}
    video{width:100%; height:auto; display:block; object-fit:cover;}
    canvas{display:none;}
    button, select, label.input-btn{
      font-size:16px; border:none; border-radius:12px; padding:12px 14px; background:var(--pri); color:#fff; cursor:pointer;
      display:inline-flex; align-items:center; gap:8px; box-shadow:0 4px 12px rgb(0 0 0 / 0.2);
    }
    button.secondary{background:#334155}
    button.warn{background:var(--warn)}
    button:disabled{opacity:.55; cursor:not-allowed}
    select{background:#334155}
    .row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:8px}
    .shots{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
    .shots img{width:100%; border-radius:12px; display:block; background:#000}
    .hint{color:var(--sub); font-size:.9rem; text-align:center}
    .error{color:#ffd0d0; background:#3b0f0f; padding:10px; border-radius:10px; display:none; white-space:pre-wrap}
    .hidden{display:none}
    @supports(-webkit-touch-callout:none){ .videoBox{max-height:62vh} }
  </style>
</head>
<body>
<div class="wrap">
  <h1>📷 카메라로 사진 찍기 (모바일/PC)</h1>
  <div class="grid">
    <div id="err" class="error"></div>

    <div class="card">
      <div class="videoBox">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
      </div>

      <div class="row">
        <button id="btnStart">카메라 시작</button>
        <button id="btnSwitch" class="secondary" disabled>전/후면·장치 전환</button>
        <button id="btnTorch" class="secondary" disabled>🔦 플래시</button>
        <button id="btnCapture" disabled>📸 촬영</button>
        <button id="btnStop" class="warn" disabled>정지</button>
      </div>

      <div class="row">
        <select id="deviceSelect" class="hidden" title="카메라 선택"></select>
        <label class="input-btn secondary" title="폴백으로 파일 선택">
          📁 폴백으로 사진 선택
          <input id="fileInput" type="file" accept="image/*" capture="environment" style="display:none"/>
        </label>
      </div>

      <p class="hint">
        ⚙️ HTTPS(또는 localhost)에서만 카메라 권한이 열립니다. iOS Safari는 버튼을 눌러야 시작됩니다.
      </p>
    </div>

    <div class="card">
      <div class="row">
        <button id="btnDownload" class="secondary" disabled>💾 마지막 사진 저장</button>
        <button id="btnShare" class="secondary" disabled>📤 iOS로 저장/공유</button>
        <button id="btnClear" class="secondary" disabled>🧹 미리보기 비우기</button>
      </div>
      <div id="shots" class="shots"></div>
    </div>
  </div>
</div>

<script>
  const els = {
    video: document.getElementById('video'),
    canvas: document.getElementById('canvas'),
    err: document.getElementById('err'),
    btnStart: document.getElementById('btnStart'),
    btnStop: document.getElementById('btnStop'),
    btnCapture: document.getElementById('btnCapture'),
    btnSwitch: document.getElementById('btnSwitch'),
    btnTorch: document.getElementById('btnTorch'),
    btnDownload: document.getElementById('btnDownload'),
    btnShare: document.getElementById('btnShare'),
    btnClear: document.getElementById('btnClear'),
    shots: document.getElementById('shots'),
    deviceSelect: document.getElementById('deviceSelect'),
    fileInput: document.getElementById('fileInput'),
  };

  let stream=null, currentTrack=null, lastBlobUrl=null, hasTorch=false, usingBack=true;

  const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const isSecure=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';

  function showError(msg,e=null){
    els.err.style.display='block';
    els.err.textContent='오류: '+msg+(e?`\n[${e.name}] ${e.message}`:'');
    console.error(msg,e);
  }
  function clearError(){ els.err.style.display='none'; els.err.textContent=''; }

  async function listCameras(){
    try{ return (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'); }
    catch(e){ showError('카메라 목록을 가져올 수 없습니다.',e); return []; }
  }

  function buildConstraints({deviceId=null,facingMode=null,tier=1}={}){
    const tiers={
      1:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:60}},
      2:{width:{ideal:960},height:{ideal:540},frameRate:{ideal:24,max:60}},
      3:{width:{ideal:640},height:{ideal:480},frameRate:{ideal:24,max:30}},
      4:{}
    };
    const video=Object.assign({},tiers[tier]||{});
    if(deviceId) video.deviceId={exact:deviceId};
    else if(facingMode) video.facingMode={exact:facingMode};
    return {audio:false,video:Object.keys(video).length?video:true};
  }

  async function startStream({deviceId=null,preferFacing=null}={}){
    clearError(); stopStream();
    if(!isSecure){ showError('HTTPS 또는 localhost에서만 사용 가능합니다.'); return; }
    const attempts=[];
    if(isMobile){
      if(preferFacing) attempts.push({facingMode:preferFacing,tier:1});
      else attempts.push({facingMode:'environment',tier:1});
      attempts.push({facingMode:'environment',tier:2},{facingMode:'user',tier:2},{tier:3},{tier:4});
    }else{
      if(deviceId) attempts.push({deviceId,tier:1});
      attempts.push({tier:1},{tier:2},{tier:3},{tier:4});
    }
    for(const opt of attempts){
      try{ stream=await navigator.mediaDevices.getUserMedia(buildConstraints(opt)); break; }
      catch(e){ continue; }
    }
    if(!stream){ showError('카메라를 시작할 수 없습니다.'); return; }

    els.video.srcObject=stream;
    currentTrack=stream.getVideoTracks()[0];

    // 토치 지원 체크
    try{
      const caps=currentTrack.getCapabilities?.();
      if(caps && 'torch' in caps){ hasTorch=true; els.btnTorch.disabled=false; }
    }catch(_){}

    // 장치 목록 UI
    const cams=await listCameras();
    if(cams.length>1){
      els.deviceSelect.classList.remove('hidden');
      els.deviceSelect.innerHTML=cams.map(d=>`<option value="${d.deviceId}">${d.label||'카메라'}</option>`).join('');
      const cur=currentTrack.getSettings?.().deviceId;
      if(cur) els.deviceSelect.value=cur;
    }else{ els.deviceSelect.classList.add('hidden'); }

    els.btnCapture.disabled=false;
    els.btnStart.disabled=true;
    els.video.onplaying=()=>{ els.btnStop.disabled=false; els.btnSwitch.disabled=cams.length<=1&&!isMobile; };
  }

  function stopStream(){ if(stream){stream.getTracks().forEach(t=>t.stop());} stream=null; currentTrack=null; els.video.srcObject=null; els.btnCapture.disabled=true; els.btnStop.disabled=true; els.btnSwitch.disabled=true; els.btnTorch.disabled=true; els.btnStart.disabled=false; }

  async function toggleTorch(){ if(!currentTrack)return; try{ const s=currentTrack.getSettings?.()||{}; const isOn=s.torch===true; await currentTrack.applyConstraints({advanced:[{torch:!isOn}]}); els.btnTorch.textContent=!isOn?'🔦 플래시 끄기':'🔦 플래시'; }catch(e){ showError('플래시를 켤 수 없습니다.',e); els.btnTorch.disabled=true; } }

  function capture(){ if(!stream)return; const v=els.video,c=els.canvas; c.width=v.videoWidth||1280;c.height=v.videoHeight||720; c.getContext('2d').drawImage(v,0,0,c.width,c.height); c.toBlob(b=>{ if(!b)return; const url=URL.createObjectURL(b); lastBlobUrl=url; addShot(url); els.btnDownload.disabled=false; els.btnClear.disabled=false; els.btnShare.disabled=false;},'image/jpeg',0.92); }

  function addShot(url){ const img=new Image(); img.src=url; const w=document.createElement('div'); w.appendChild(img); els.shots.prepend(w); }

  function downloadLast(){ if(!lastBlobUrl)return; const a=document.createElement('a'); a.href=lastBlobUrl;a.download='photo.jpg';document.body.appendChild(a);a.click();a.remove(); }

  async function shareOnIOS(){
    if(!lastBlobUrl){showError('공유할 이미지가 없습니다.');return;}
    const res=await fetch(lastBlobUrl);const blob=await res.blob();
    const file=new File([blob],'photo.jpg',{type:'image/jpeg'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'photo.jpg'});
    }else{
      const reader=new FileReader();
      reader.onload=()=>{ const a=document.createElement('a'); a.href=reader.result;a.target='_blank';document.body.appendChild(a);a.click();a.remove(); showError('이미지 탭이 열렸습니다. 길게 눌러 “사진에 추가” 또는 “파일에 저장”을 선택하세요.');};
      reader.readAsDataURL(blob);
    }
  }

  function clearShots(){ els.shots.innerHTML=''; if(lastBlobUrl){URL.revokeObjectURL(lastBlobUrl); lastBlobUrl=null;} els.btnDownload.disabled=true; els.btnClear.disabled=true; els.btnShare.disabled=true; }

  // 이벤트 바인딩
  els.btnStart.addEventListener('click',()=>startStream({preferFacing:isMobile?'environment':null}));
  els.btnStop.addEventListener('click',stopStream);
  els.btnCapture.addEventListener('click',capture);
  els.btnDownload.addEventListener('click',downloadLast);
  els.btnClear.addEventListener('click',clearShots);
  els.btnTorch.addEventListener('click',toggleTorch);
  els.btnShare.addEventListener('click',shareOnIOS);

  els.btnSwitch.addEventListener('click',async()=>{
    const cams=await listCameras();
    if(isMobile){
      usingBack=!usingBack;
      const target=cams.find(d=>{ const n=(d.label||'').toLowerCase(); return usingBack?(n.includes('back')||n.includes('rear')||n.includes('environment')):(n.includes('front')||n.includes('user')); })||cams[0];
      if(target) startStream({deviceId:target.deviceId});
      else startStream({preferFacing:usingBack?'environment':'user'});
    }else{
      if(cams.length<=1)return;
      const ids=cams.map(c=>c.deviceId); const cur=currentTrack?.getSettings?.().deviceId; const idx=Math.max(0,ids.indexOf(cur)); const nextId=ids[(idx+1)%ids.length]; startStream({deviceId:nextId});
    }
  });

  els.deviceSelect.addEventListener('change',e=>{ const id=e.target.value; if(id) startStream({deviceId:id}); });

  els.fileInput.addEventListener('change',e=>{ const f=e.target.files?.[0]; if(!f)return; const url=URL.createObjectURL(f); lastBlobUrl=url; addShot(url); els.btnDownload.disabled=false; els.btnClear.disabled=false; els.btnShare.disabled=false; });

  if(!('mediaDevices' in navigator) || !('getUserMedia' in navigator.mediaDevices)){ showError('이 브라우저는 getUserMedia를 지원하지 않습니다.'); }
  if(!isSecure){ showError('HTTPS 또는 localhost로 접속해야 합니다.'); }
</script>
</body>
</html>
