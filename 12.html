<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
  <title>📷 카메라로 사진 찍기 (모바일 웹)</title>
  <style>
    :root{
      --bg:#0b0f14; --card:#101725; --pri:#4ea1ff; --txt:#e8f1ff; --sub:#a7bed3; --warn:#ff6b6b;
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
    html,body{margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;}
    .wrap{max-width:900px; margin:0 auto; padding:16px;}
    h1{font-size:1.4rem; margin:8px 0 12px; text-align:center}
    .card{background:var(--card); border-radius:16px; padding:12px; box-shadow:0 8px 24px rgb(0 0 0 / 0.25);}
    .grid{display:grid; gap:12px;}
    .videoBox{position:relative; border-radius:12px; overflow:hidden; background:#000;}
    video{width:100%; height:auto; display:block; object-fit:cover;}
    canvas{display:none;}
    .btns{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
    button, select, label.input-btn{
      font-size:16px; border:none; border-radius:12px; padding:12px 14px; background:var(--pri); color:#fff; cursor:pointer;
      display:inline-flex; align-items:center; gap:8px; box-shadow:0 4px 12px rgb(0 0 0 / 0.2);
    }
    button.secondary{background:#334155}
    button.warn{background:var(--warn)}
    button:disabled{opacity:.55; cursor:not-allowed}
    select{background:#334155}
    .row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
    .preview{display:grid; gap:8px;}
    .shots{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
    .shots img{width:100%; border-radius:12px; display:block; background:#000}
    .hint{color:var(--sub); font-size:.9rem; text-align:center}
    .error{color:#ffd0d0; background:#3b0f0f; padding:10px; border-radius:10px; display:none}
    .hidden{display:none}
    /* iOS full-height fix */
    @supports(-webkit-touch-callout:none){
      .videoBox{max-height:62vh}
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>📷 카메라로 사진 찍기 (모바일 웹)</h1>
  <div class="grid">
    <div id="err" class="error"></div>

    <div class="card">
      <div class="videoBox">
        <!-- iOS에서 자동재생을 위해 muted + playsinline 필수 -->
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
      </div>

      <div class="row" style="margin-top:10px">
        <button id="btnStart">카메라 시작</button>
        <button id="btnSwitch" class="secondary" disabled>전/후면 전환</button>
        <button id="btnTorch" class="secondary" disabled>🔦 플래시</button>
        <button id="btnCapture" disabled>📸 촬영</button>
        <button id="btnStop" class="warn" disabled>정지</button>
      </div>

      <div class="row">
        <select id="deviceSelect" class="hidden"></select>
        <!-- 폴백: 파일 입력(일부 iOS/보안 환경에서 getUserMedia가 막힌 경우) -->
        <label class="input-btn secondary">
          📁 폴백으로 사진 선택
          <input id="fileInput" type="file" accept="image/*" capture="environment" style="display:none"/>
        </label>
      </div>

      <p class="hint">
        ⚙️ 팁: HTTPS(또는 localhost)에서 열어야 카메라 권한이 열립니다. iOS Safari는 사용자의 터치로 시작해야 스트림이 열립니다.
      </p>
    </div>

    <div class="card preview">
      <div class="row">
        <button id="btnDownload" class="secondary" disabled>💾 마지막 사진 저장</button>
        <button id="btnClear" class="secondary" disabled>🧹 미리보기 비우기</button>
      </div>
      <div id="shots" class="shots"></div>
    </div>
  </div>
</div>

<script>
  const els = {
    video: document.getElementById('video'),
    canvas: document.getElementById('canvas'),
    err: document.getElementById('err'),
    btnStart: document.getElementById('btnStart'),
    btnStop: document.getElementById('btnStop'),
    btnCapture: document.getElementById('btnCapture'),
    btnSwitch: document.getElementById('btnSwitch'),
    btnTorch: document.getElementById('btnTorch'),
    btnDownload: document.getElementById('btnDownload'),
    btnClear: document.getElementById('btnClear'),
    shots: document.getElementById('shots'),
    deviceSelect: document.getElementById('deviceSelect'),
    fileInput: document.getElementById('fileInput'),
  };

  let stream = null;
  let usingBack = true;        // 기본: 후면
  let currentTrack = null;     // Video track
  let lastBlobUrl = null;
  let hasTorch = false;

  function showError(msg, e=null){
    els.err.style.display = 'block';
    els.err.textContent = '오류: ' + msg + (e ? ' (' + (e.message || e.name || e) + ')' : '');
    console.error(msg, e);
  }
  function clearError(){
    els.err.style.display = 'none';
    els.err.textContent = '';
  }

  async function listCameras(){
    try{
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter(d => d.kind === 'videoinput');
      return cams;
    }catch(e){
      showError('카메라 목록을 가져올 수 없습니다.', e);
      return [];
    }
  }

  async function startStream({deviceId=null, facingMode=null}={}){
    clearError();
    stopStream();

    const constraints = {
      audio:false,
      video: {
        width: { ideal: 1280 },
        height:{ ideal: 720 },
        frameRate: { ideal: 30, max: 60 }
      }
    };

    if (deviceId){
      constraints.video.deviceId = { exact: deviceId };
    }else if (facingMode){
      constraints.video.facingMode = { exact: facingMode };
    }else{
      constraints.video.facingMode = { ideal: 'environment' };
    }

    try{
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      els.video.srcObject = stream;

      // 트랙/토치 여부 체크
      currentTrack = stream.getVideoTracks()[0];
      hasTorch = false;
      els.btnTorch.disabled = true;
      try{
        const caps = currentTrack.getCapabilities?.();
        if (caps && 'torch' in caps){
          hasTorch = true;
          els.btnTorch.disabled = false;
        }
      }catch(_) {}

      // 디바이스 목록 UI
      const cams = await listCameras();
      if (cams.length > 1){
        els.deviceSelect.classList.remove('hidden');
        els.deviceSelect.innerHTML = cams.map(d => `<option value="${d.deviceId}">${d.label || '카메라'}</option>`).join('');
        // 선택값 동기화
        if (deviceId){
          els.deviceSelect.value = deviceId;
        }
      }else{
        els.deviceSelect.classList.add('hidden');
      }

      // 버튼 상태
      els.btnCapture.disabled = false;
      els.btnStop.disabled = false;
      els.btnSwitch.disabled = cams.length > 1; // 카메라가 둘 이상이면 전환 버튼 활성화
      els.btnStart.disabled = true;

    }catch(e){
      // 권한 거부 또는 환경 미지원
      showError('카메라를 시작할 수 없습니다. 권한 또는 환경을 확인하세요.', e);
      // 폴백: 파일 입력 안내
    }
  }

  function stopStream(){
    if(stream){
      for (const t of stream.getTracks()) t.stop();
      stream = null;
    }
    currentTrack = null;
    els.video.srcObject = null;
    els.btnCapture.disabled = true;
    els.btnStop.disabled = true;
    els.btnSwitch.disabled = true;
    els.btnTorch.disabled = true;
    els.btnStart.disabled = false;
  }

  async function toggleTorch(){
    if(!currentTrack) return;
    try{
      const settings = currentTrack.getSettings?.() || {};
      const isOn = settings.torch === true;
      await currentTrack.applyConstraints({ advanced: [{ torch: !isOn }] });
      els.btnTorch.textContent = !isOn ? '🔦 플래시 끄기' : '🔦 플래시';
    }catch(e){
      showError('플래시를 켤 수 없는 기기/브라우저입니다.', e);
      els.btnTorch.disabled = true;
    }
  }

  function capture(){
    if(!stream){ return; }
    const video = els.video;
    const canvas = els.canvas;

    // 비디오 실제 크기 기준
    const vw = video.videoWidth || 1280;
    const vh = video.videoHeight || 720;

    canvas.width = vw;
    canvas.height = vh;

    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, vw, vh);

    canvas.toBlob(blob => {
      if(!blob) return;
      const url = URL.createObjectURL(blob);
      lastBlobUrl = url;
      addShot(url);
      els.btnDownload.disabled = false;
      els.btnClear.disabled = false;
    }, 'image/jpeg', 0.92);
  }

  function addShot(url){
    const img = new Image();
    img.src = url;
    img.alt = '캡처 이미지';
    img.onload = () => URL.revokeObjectURL; // 메모: 개별 해제는 다운로드/클리어 때 처리
    const wrap = document.createElement('div');
    wrap.appendChild(img);

    // 다운로드 버튼 추가(각 이미지별)
    const a = document.createElement('a');
    a.textContent = '저장';
    a.download = 'photo.jpg';
    a.href = url;
    a.style.display = 'inline-block';
    a.style.marginTop = '6px';
    a.style.color = '#cfe3ff';
    wrap.appendChild(a);

    els.shots.prepend(wrap);
  }

  function downloadLast(){
    if(!lastBlobUrl) return;
    const a = document.createElement('a');
    a.href = lastBlobUrl;
    a.download = 'photo.jpg';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function clearShots(){
    els.shots.innerHTML = '';
    if(lastBlobUrl){
      URL.revokeObjectURL(lastBlobUrl);
      lastBlobUrl = null;
    }
    els.btnDownload.disabled = true;
    els.btnClear.disabled = true;
  }

  // 이벤트 바인딩
  els.btnStart.addEventListener('click', () => {
    // 기본은 후면
    startStream({ facingMode: 'environment' });
    usingBack = true;
  });
  els.btnStop.addEventListener('click', stopStream);
  els.btnCapture.addEventListener('click', capture);
  els.btnDownload.addEventListener('click', downloadLast);
  els.btnClear.addEventListener('click', clearShots);
  els.btnSwitch.addEventListener('click', async () => {
    // 전/후면 전환 (기기별로 deviceId 방식이 더 안정적일 수 있음)
    usingBack = !usingBack;
    const cams = await listCameras();
    // facingMode가 불안정할 때는 라벨로 후면/전면 추정
    const target = cams.find(d => {
      const name = (d.label || '').toLowerCase();
      return usingBack ? name.includes('back') || name.includes('rear') || name.includes('environment')
                       : name.includes('front') || name.includes('user');
    }) || cams[0];
    if(target) startStream({ deviceId: target.deviceId });
    else startStream({ facingMode: usingBack ? 'environment' : 'user' });
  });
  els.deviceSelect.addEventListener('change', (e) => {
    const id = e.target.value;
    if(id) startStream({ deviceId: id });
  });

  // 폴백: 파일 입력에서도 미리보기 추가
  els.fileInput.addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    lastBlobUrl = url;
    addShot(url);
    els.btnDownload.disabled = false;
    els.btnClear.disabled = false;
  });

  // 지원 여부 사전 체크
  if(!('mediaDevices' in navigator) || !('getUserMedia' in navigator.mediaDevices)){
    showError('이 브라우저는 getUserMedia를 지원하지 않습니다. (파일 선택 폴백을 사용하세요)');
  }

  // 페이지가 iframe 안에 있다면 allow 속성 필요:
  // <iframe src="..." allow="camera; microphone; fullscreen"></iframe>

  // 서버 업로드 예시 (원한다면 주석 해제해 구현):
  // async function uploadLast(){
  //   if(!lastBlobUrl) return;
  //   const res = await fetch(lastBlobUrl);
  //   const blob = await res.blob();
  //   const form = new FormData();
  //   form.append('photo', blob, 'photo.jpg');
  //   await fetch('/upload', { method:'POST', body: form });
  // }
</script>
</body>
</html>
