<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <!-- 핀치줌 차단 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Vertical Shooter (모바일 조이스틱/발사 버튼)</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root{
      --bg:#0b0f14; --card:#101725; --pri:#4ea1ff; --txt:#e8f1ff; --sub:#a7bed3; --good:#32d26f; --warn:#ffb74e; --bad:#ff6b6b;
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
    html,body{margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial;}
    #topbar{
      position:fixed; inset:0 0 auto 0; height:56px; display:flex; align-items:center; gap:8px;
      padding:8px 10px; background:#0e1522cc; backdrop-filter: blur(6px); z-index:10;
      border-bottom:1px solid #1a2233;
    }
    #topbar .btn{ padding:8px 12px; border:none; border-radius:10px; background:var(--pri); color:#fff; font-weight:600; cursor:pointer; }
    #topbar .btn:active{ transform: translateY(1px); }
    #topbar .title{ margin-left:4px; font-weight:700; letter-spacing:.3px; }
    #topbar .spacer{ flex:1; }
    #hpContainer{ display:flex; gap:6px; align-items:center; }
    .hpSlot{
      width:22px; height:10px; border-radius:999px; border:1px solid #2b3c5a; background:#1a2436; overflow:hidden;
    }
    .hpFill{ height:100%; width:100%; background:linear-gradient(180deg,#4ef7a3,#23c16b); }
    .hpFill.warn{ background:linear-gradient(180deg,#ffd27a,#ff9f43); }
    .hpFill.bad{ background:linear-gradient(180deg,#ff9aa2,#ff6b6b); }

    /* 캔버스는 세로 모드 기준 꽉 채우기 */
    #gameWrap{ position:fixed; inset:56px 0 0 0; }
    #gameCanvas{ width:100vw; height:calc(100vh - 56px); display:block; background:var(--card); touch-action:none; }

    /* 모바일 HUD */
    #hud{ position:fixed; inset:56px 0 0 0; pointer-events:none; }
    .joyWrap, .fireWrap{ position:absolute; pointer-events:auto; }
    .joyWrap{ left:14px; bottom:18px; width:140px; height:140px; border-radius:50%; background:#0d1423aa; border:1px solid #1f2a42; }
    .joyBase{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:120px; height:120px; border-radius:50%; border:2px dashed #2a3d62; }
    .joyKnob{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:70px; height:70px; border-radius:50%; background:#20304f; border:2px solid #3d5b94; }
    .fireWrap{ right:16px; bottom:24px; width:110px; height:110px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
    .fireBtn{ width:100%; height:100%; border-radius:50%; border:none; background:radial-gradient(circle at 35% 35%, #ffefef, #ff5b5b 60%, #992c2c 100%);
      box-shadow: 0 10px 18px rgba(0,0,0,.35), inset 0 2px 8px rgba(255,255,255,.35);
      font-weight:900; color:#fff; font-size:18px; letter-spacing:.5px; }
    .fireBtn:active{ transform: scale(.98); }

    #overlay{
      position:fixed; inset:56px 0 0 0; display:none; align-items:center; justify-content:center;
      background:rgba(6,10,18,.6); z-index:12;
    }
    #overlay .panel{
      background:#0f1625; border:1px solid #1e2a43; border-radius:16px; padding:18px; width:min(92vw, 420px); text-align:center;
      box-shadow:0 10px 28px rgba(0,0,0,.45);
    }
    #overlay h2{ margin:10px 0 4px; }
    #overlay p{ margin:6px 0 16px; color:var(--sub); }
    #overlay .row{ display:flex; gap:10px; justify-content:center; }
    #overlay .row .btn{ padding:10px 14px; border:none; border-radius:10px; background:var(--pri); color:#fff; font-weight:700; cursor:pointer; }
  </style>
</head>
<body>
  <div id="topbar">
    <span class="title">✈️ Vertical Shooter</span>
    <div class="spacer"></div>
    <button class="btn" id="resetBtn">리셋</button>
    <a class="btn" href="index.html">홈</a>
    <div id="hpContainer">
      <div class="hpSlot"><div class="hpFill" id="hp1"></div></div>
      <div class="hpSlot"><div class="hpFill" id="hp2"></div></div>
      <div class="hpSlot"><div class="hpFill" id="hp3"></div></div>
      <div class="hpSlot"><div class="hpFill" id="hp4"></div></div>
      <div class="hpSlot"><div class="hpFill" id="hp5"></div></div>
    </div>
  </div>

  <div id="gameWrap">
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
      <div class="joyWrap" id="joy">
        <div class="joyBase"></div>
        <div class="joyKnob" id="joyKnob"></div>
      </div>
      <div class="fireWrap"><button class="fireBtn" id="fireBtn">FIRE</button></div>
    </div>
  </div>

  <div id="overlay">
    <div class="panel">
      <h2 id="ovTitle">GAME OVER</h2>
      <p id="ovMsg">다시 도전해 보세요!</p>
      <div class="row">
        <button class="btn" id="ovReset">다시 시작</button>
        <a class="btn" href="index.html">홈으로</a>
      </div>
    </div>
  </div>

  <audio id="sndShoot" src="shoot.mp3"></audio>
  <audio id="sndHit" src="hit.mp3"></audio>
  <audio id="sndItem" src="item.mp3"></audio>
  <audio id="sndOver" src="over.mp3"></audio>

  <script>
  // ====== 핀치줌 차단 ======
  document.addEventListener('gesturestart', e => e.preventDefault(), {passive:false});
  document.addEventListener('gesturechange', e => e.preventDefault(), {passive:false});
  document.addEventListener('gestureend', e => e.preventDefault(), {passive:false});
  window.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, {passive:false});
  let _lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - _lastTouchEnd <= 300) e.preventDefault();
    _lastTouchEnd = now;
  }, {passive:false});

  // ===== 기본 캔버스/스케일 =====
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const VW = 540, VH = 960;
  let scale = 1, offX = 0, offY = 0;

  function fitCanvas(){
    const w = window.innerWidth;
    const h = window.innerHeight - 56;
    canvas.width = w * devicePixelRatio;
    canvas.height = h * devicePixelRatio;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(1,0,0,1,0,0);
    const s = Math.min(w / VW, h / VH);
    scale = s * devicePixelRatio;
    offX = ((w * devicePixelRatio) - VW*scale) / 2;
    offY = ((h * devicePixelRatio) - VH*scale) / 2;
    ctx.setTransform(scale,0,0,scale, offX, offY);
  }
  window.addEventListener('resize', fitCanvas, {passive:true});
  fitCanvas();

  // ===== 유틸 =====
  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
  function rand(a,b){ return a + Math.random()*(b-a); }
  function now(){ return performance.now(); }

  // ===== 사운드 =====
  const sndShoot = document.getElementById('sndShoot');
  const sndHit   = document.getElementById('sndHit');
  const sndItem  = document.getElementById('sndItem');
  const sndOver  = document.getElementById('sndOver');
  function playSafe(a){ try{ a.currentTime = 0; a.play(); }catch(e){} }

  // ===== 스프라이트 =====
  const imgPlayer = new Image(); imgPlayer.src = "my.png";
  const imgEnemy  = new Image(); imgEnemy.src  = "target.png";
  const imgEnemy2 = new Image(); imgEnemy2.src = "target2.png"; // ★ 추가된 적기
  const imgCoin   = new Image(); imgCoin.src   = "coin.png";
  const SPRITE_SCALE = 0.1;

  // ===== 배경 =====
  const bg = new Image(); bg.src = "33.png";
  let bgY = 0;
  const BG_SPEED = 24; // px/sec
  // ===== 게임 객체 =====
  const player = {
    x: VW*0.5, y: VH*0.8,
    r: 18, speed: 300, vx: 0, vy: 0,
    hp: 5, hpMax: 5, invincibleUntil: 0,
  };

  const bullets = [];      // {x,y,vy,r}
  const enemies = [];      // {x,y,r,vy,hp,timer,shootable,type}
  const eBullets = [];     // {x,y,vy,r,vx?}
  const items = [];        // {x,y,r,vy}

  let lastSpawn = 0;
  let lastItemSpawn = 0;
  let gameOver = false;
  let score = 0;
  let startTime = now();   
  let difficultyLevel = 1;

  // 보스
  let boss = null;
  const BOSS_HP = 30;
  const BOSS_SCALE = SPRITE_SCALE * 3;

  // ===== HP UI =====
  const hpEls = [1,2,3,4,5].map(i=>document.getElementById('hp'+i));
  function syncHP(){
    for(let i=0;i<player.hpMax;i++){
      const fill = hpEls[i]; if(!fill) continue;
      fill.style.width = (i < player.hp) ? '100%' : '0%';
      fill.classList.remove('warn','bad');
      const ratio = player.hp / player.hpMax;
      if(ratio <= 0.4) fill.classList.add('bad');
      else if(ratio <= 0.6) fill.classList.add('warn');
    }
  }
  syncHP();

  // ===== 조작 =====
  const joy = document.getElementById('joy'),
        joyKnob = document.getElementById('joyKnob'),
        fireBtn = document.getElementById('fireBtn');
  let joyActive = false, joyId = null;

  function screenToJoy(x,y){
    const r = joy.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    return {dx:x-cx, dy:y-cy, cx, cy, max:r.width*0.42};
  }
  function onJoyStart(x,y,id){
    const {dx,dy,max} = screenToJoy(x,y);
    joyActive = true; joyId = id;
    updateKnob(dx,dy,max);
  }
  function onJoyMove(x,y){
    if(!joyActive) return;
    const {dx,dy,max} = screenToJoy(x,y);
    updateKnob(dx,dy,max);
  }
  function onJoyEnd(id){
    if(joyId!==id) return;
    joyActive=false; joyId=null;
    joyKnob.style.left='50%'; joyKnob.style.top='50%';
    player.vx=player.vy=0;
  }
  function updateKnob(dx,dy,max){
    const len = Math.hypot(dx,dy);
    const cl = Math.min(len,max);
    const nx = dx/(len||1), ny = dy/(len||1);
    joyKnob.style.left = (50+(cl*nx)/max*40)+'%';
    joyKnob.style.top  = (50+(cl*ny)/max*40)+'%';
    player.vx = nx*player.speed*(cl/max);
    player.vy = ny*player.speed*(cl/max);
  }

  function inEl(el,x,y){
    const r=el.getBoundingClientRect();
    return (x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom);
  }
  window.addEventListener('pointerdown',e=>{
    if(inEl(joy,e.clientX,e.clientY)) onJoyStart(e.clientX,e.clientY,e.pointerId);
    else if(inEl(fireBtn,e.clientX,e.clientY)) fire();
  });
  window.addEventListener('pointermove',e=>{
    if(joyActive&&joyId===e.pointerId) onJoyMove(e.clientX,e.clientY);
  });
  window.addEventListener('pointerup',e=>onJoyEnd(e.pointerId));
  window.addEventListener('pointercancel',e=>onJoyEnd(e.pointerId));
  fireBtn.addEventListener('click',()=>fire());

  const keys={};
  window.addEventListener('keydown',e=>{
    keys[e.code]=true;
    if(e.code==='Space'){ e.preventDefault(); fire(); }
  });
  window.addEventListener('keyup',e=>{ keys[e.code]=false; });

  // ===== 발사/스폰 =====
  function fire(){
    if(gameOver) return;
    bullets.push({x:player.x,y:player.y-24,vy:-620,r:5});
    playSafe(sndShoot);
  }

  function spawnEnemy(){
    const x=rand(40,VW-40), y=-30;
    const r=rand(14,22), vy=rand(80,150)*difficultyLevel;

    if(Math.random()<0.3){
      // 새로운 적기 (target2.png)
      enemies.push({type:"enemy2",x,y,r,vy:vy*1.1,hp:2,timer:0});
    } else {
      // 기존 적기
      enemies.push({type:"enemy",x,y,r,vy,hp:1+(Math.random()<0.15?1:0),timer:0,shootable:Math.random()<0.2});
    }
  }

  function spawnItem(){
    const x=rand(40,VW-40);
    items.push({x,y:-20,r:12,vy:120});
  }

  function hitCircle(a,b){
    const dx=a.x-b.x,dy=a.y-b.y;
    return(dx*dx+dy*dy)<=(a.r+b.r)*(a.r+b.r);
  }
  // ===== 업데이트 =====
  let last=now();
  function update(dt){
    if(gameOver) return;
    const elapsed=(now()-startTime)/1000;
    difficultyLevel = 1 + elapsed/60; // 부드럽게 난이도 증가

    // 보스 소환 (4분 후)
    if(elapsed>=240 && !boss){
      boss={x:VW/2,y:150,r:60,hp:BOSS_HP,timer:0};
    }

    // 키보드 이동
    if(!joyActive){
      let vx=0,vy=0;
      if(keys['ArrowLeft']||keys['KeyA']) vx-=1;
      if(keys['ArrowRight']||keys['KeyD']) vx+=1;
      if(keys['ArrowUp']||keys['KeyW']) vy-=1;
      if(keys['ArrowDown']||keys['KeyS']) vy+=1;
      const n=Math.hypot(vx,vy)||1;
      player.vx=(vx/n)*player.speed*(vx||vy?1:0);
      player.vy=(vy/n)*player.speed*(vx||vy?1:0);
    }
    player.x=clamp(player.x+player.vx*dt,24,VW-24);
    player.y=clamp(player.y+player.vy*dt,24,VH-24);

    // 총알 이동
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];
      b.y+=b.vy*dt;
      if(b.y<-30) bullets.splice(i,1);
    }

    // 적 스폰
    if(now()-lastSpawn>2000/difficultyLevel){ 
      lastSpawn=now(); 
      spawnEnemy(); 
    }
    if(now()-lastItemSpawn>rand(8000,12000)){ 
      lastItemSpawn=now(); 
      spawnItem(); 
    }

    // 적 이동/충돌
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];

      if(e.type==="enemy2"){ 
        // 새로운 적기: 사선으로 플레이어 추적
        const dx=player.x-e.x, dy=player.y-e.y, dist=Math.hypot(dx,dy)||1;
        e.x+=(dx/dist)*100*dt; 
        e.y+=e.vy*dt; 
      } else {
        // 기존 적기
        e.y+=e.vy*dt; 
        e.timer+=dt;
        if(e.shootable && e.timer>1.2 && Math.random()<0.015*difficultyLevel){
          eBullets.push({x:e.x,y:e.y+10,vy:220,r:4});
          e.timer=0;
        }
      }

      // 총알과 충돌
      for(let j=bullets.length-1;j>=0;j--){
        if(hitCircle(e,bullets[j])){
          bullets.splice(j,1); e.hp--;
          if(e.hp<=0){ enemies.splice(i,1); score+=100; }
          playSafe(sndHit); 
          break;
        }
      }
      if(!gameOver && now()>player.invincibleUntil && hitCircle(e,player)){
        enemies.splice(i,1); 
        damagePlayer();
      } else if(e.y>VH+40) enemies.splice(i,1);
    }

    // 보스 로직
    if(boss){
      boss.timer+=dt;
      if(boss.timer>0.8){
        const speed=200;
        // 좌우 사선탄
        eBullets.push({x:boss.x,y:boss.y,vx:-speed*0.7,vy:speed*0.7,r:6});
        eBullets.push({x:boss.x,y:boss.y,vx:speed*0.7,vy:speed*0.7,r:6});
        // 아래 직선탄 추가
        eBullets.push({x:boss.x,y:boss.y,vx:0,vy:speed,r:6});
        boss.timer=0;
      }
      for(let j=bullets.length-1;j>=0;j--){
        if(hitCircle(boss,bullets[j])){
          bullets.splice(j,1); boss.hp--;
          if(boss.hp<=0){ boss=null; endGame(true); }
          playSafe(sndHit); 
          break;
        }
      }
    }

    // 적탄 이동
    for(let i=eBullets.length-1;i>=0;i--){
      const eb=eBullets[i];
      eb.x+=(eb.vx||0)*dt; eb.y+=eb.vy*dt;
      if(eb.y>VH+20||eb.x<0||eb.x>VW){ eBullets.splice(i,1); continue; }
      if(!gameOver&&now()>player.invincibleUntil&&hitCircle(eb,player)){
        eBullets.splice(i,1); damagePlayer();
      }
    }

    // 아이템 이동
    for(let i=items.length-1;i>=0;i--){
      const it=items[i];
      it.y+=it.vy*dt;
      if(it.y>VH+30){ items.splice(i,1); continue; }
      if(hitCircle(it,player)){
        items.splice(i,1);
        if(player.hp<player.hpMax) player.hp++;
        syncHP(); playSafe(sndItem);
      }
    }
  }
  function damagePlayer(){
    player.hp--; 
    syncHP();
    player.invincibleUntil=now()+900;
    if(player.hp<=0){ 
      player.hp=0; 
      endGame(false); 
    }
  }

  function endGame(victory){
    gameOver=true;
    document.getElementById('ovTitle').textContent = victory?'STAGE CLEAR!':'GAME OVER';
    document.getElementById('ovMsg').textContent = `점수: ${score.toLocaleString()}`;
    document.getElementById('overlay').style.display='flex';
    playSafe(sndOver);
  }

  // ===== 배경 그리기 (33.png 반복) =====
  function drawBackground(dt){
    bgY += BG_SPEED * dt;
    if(bgY >= VH) bgY -= VH;
    if(bg.complete && bg.width>0){
      ctx.drawImage(bg, 0, bgY - VH, VW, VH);
      ctx.drawImage(bg, 0, bgY, VW, VH);
    } else {
      // 로드 전 단색 배경
      ctx.fillStyle="#101725";
      ctx.fillRect(0,0,VW,VH);
    }
  }

  // ===== 렌더 =====
  function draw(){
    drawBackground(1/60); // dt는 loop에서 보정됨

    // 플레이어
    if(imgPlayer.complete && imgPlayer.width>0){
      const w=imgPlayer.width*SPRITE_SCALE, h=imgPlayer.height*SPRITE_SCALE;
      ctx.drawImage(imgPlayer, player.x-w/2, player.y-h/2, w, h);
    } else {
      ctx.fillStyle='#8bd3ff';
      ctx.beginPath(); ctx.arc(player.x,player.y,20,0,Math.PI*2); ctx.fill();
    }

    // 총알
    ctx.fillStyle='#ffee88';
    bullets.forEach(b=>{
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    });

    // 적
    enemies.forEach(e=>{
      if(e.type==="enemy2" && imgEnemy2.complete && imgEnemy2.width>0){
        const w=imgEnemy2.width*SPRITE_SCALE, h=imgEnemy2.height*SPRITE_SCALE;
        ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(Math.PI);
        ctx.drawImage(imgEnemy2,-w/2,-h/2,w,h); ctx.restore();
      } else if(e.type==="enemy" && imgEnemy.complete && imgEnemy.width>0){
        const w=imgEnemy.width*SPRITE_SCALE, h=imgEnemy.height*SPRITE_SCALE;
        ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(Math.PI);
        ctx.drawImage(imgEnemy,-w/2,-h/2,w,h); ctx.restore();
      } else {
        ctx.fillStyle=e.hp>1?'#ff9f43':'#ff6b6b';
        ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill();
      }
    });

    // 보스
    if(boss && imgEnemy.complete){
      const w=imgEnemy.width*BOSS_SCALE, h=imgEnemy.height*BOSS_SCALE;
      ctx.drawImage(imgEnemy, boss.x-w/2, boss.y-h/2, w, h);
    }

    // 적탄
    ctx.fillStyle='#ffb1b1';
    eBullets.forEach(eb=>{
      ctx.beginPath(); ctx.arc(eb.x,eb.y,eb.r,0,Math.PI*2); ctx.fill();
    });

    // 아이템
    items.forEach(it=>{
      if(imgCoin.complete){
        const w=imgCoin.width*SPRITE_SCALE, h=imgCoin.height*SPRITE_SCALE;
        ctx.drawImage(imgCoin,it.x-w/2,it.y-h/2,w,h);
      } else {
        ctx.fillStyle="#FFD700";
        ctx.beginPath(); ctx.arc(it.x,it.y,it.r,0,Math.PI*2); ctx.fill();
      }
    });

    // 점수
    ctx.fillStyle='#cfe6ff';
    ctx.font='16px system-ui';
    ctx.fillText('SCORE: '+score.toString().padStart(6,'0'),10,22);
  }

  // ===== 메인 루프 =====
  function loop(){
    const t=now();
    const dt=Math.min((t-last)/1000,0.033);
    last=t;
    update(dt);
    drawBackground(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ===== 초기화/리셋 =====
  function resetGame(){
    bullets.length=0; enemies.length=0;
    eBullets.length=0; items.length=0;
    player.x=VW*0.5; player.y=VH*0.8;
    player.vx=player.vy=0;
    player.hp=player.hpMax; player.invincibleUntil=0;
    syncHP();
    lastSpawn=now(); lastItemSpawn=now();
    score=0; gameOver=false; boss=null;
    document.getElementById('overlay').style.display='none';
    bgY=0;
    startTime = now();     
    difficultyLevel = 1;   
  }

  document.getElementById('resetBtn').addEventListener('click',resetGame);
  document.getElementById('ovReset').addEventListener('click',resetGame);

  // iOS Safari에서 화면 스크롤 방지
  window.addEventListener('touchmove', e=>{
    const t=e.touches[0]; if(!t) return;
    const rect=canvas.getBoundingClientRect();
    if(t.clientX>=rect.left&&t.clientX<=rect.right&&t.clientY>=rect.top&&t.clientY<=rect.bottom){
      e.preventDefault();
    }
  }, {passive:false});

  // 시작
  resetGame();
  loop();
  </script>
</body>
</html>
