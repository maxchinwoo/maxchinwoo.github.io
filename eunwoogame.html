<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>은우 은우 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --neon-yellow: #ffd23f;
    --neon-pink: #ff3b8b;
    --neon-cyan: #3ddfff;
    --neon-red: #ff4444;
    --neon-blue: #4d9fff;
    --bg-deep: #0a0a14;
    --bg-mid: #15151f;
    --bg-card: #1d1d2c;
    --border: #2a2a3a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-deep);
    color: #fff;
    font-family: 'IBM Plex Sans KR', -apple-system, sans-serif;
    overflow: hidden;
    height: 100vh;
    user-select: none;
    -webkit-user-select: none;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,59,139,0.08), transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(61,223,255,0.08), transparent 50%),
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,0.012) 2px 3px);
    pointer-events: none;
    z-index: 0;
  }

  #wrap {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    padding: 16px;
  }
  #stage {
    position: relative;
    width: 900px;
    height: 600px;
    max-width: 100%;
    max-height: 100%;
    box-shadow:
      0 0 0 1px var(--border),
      0 0 60px rgba(255,59,139,0.15),
      0 30px 80px rgba(0,0,0,0.6);
    border-radius: 12px;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    image-rendering: pixelated;
  }

  /* HUD */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 16px;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .hud-box {
    background: rgba(10,10,20,0.78);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 13px;
    line-height: 1.5;
    font-weight: 500;
  }
  .hp-bar {
    width: 200px;
    height: 8px;
    background: rgba(0,0,0,0.6);
    border-radius: 4px;
    margin-top: 6px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .hp-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--neon-red), var(--neon-yellow));
    transition: width 0.15s;
    box-shadow: 0 0 8px rgba(255,210,63,0.5);
  }
  .score {
    font-family: 'Press Start 2P', monospace;
    font-size: 18px;
    letter-spacing: 1px;
  }
  .score .blue { color: var(--neon-cyan); text-shadow: 0 0 8px var(--neon-cyan); }
  .score .red { color: var(--neon-red); text-shadow: 0 0 8px var(--neon-red); }
  .score .sep { color: #555; margin: 0 6px; }

  #weapons-bar {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    pointer-events: none;
    z-index: 2;
  }
  .weapon-slot {
    width: 84px;
    height: 64px;
    background: rgba(10,10,20,0.85);
    backdrop-filter: blur(8px);
    border: 2px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 6px 4px;
    text-align: center;
    color: #aaa;
    font-size: 12px;
    line-height: 1.2;
    transition: all 0.15s;
  }
  .weapon-slot.active {
    border-color: var(--neon-yellow);
    background: rgba(255,210,63,0.12);
    color: #fff;
    transform: translateY(-6px);
    box-shadow: 0 4px 16px rgba(255,210,63,0.3);
  }
  .weapon-slot .key {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--neon-yellow);
    display: block;
  }
  .weapon-slot .nm {
    font-weight: 700;
    margin-top: 4px;
    font-size: 13px;
  }
  .weapon-slot .stat {
    font-size: 9px;
    color: #777;
    margin-top: 2px;
  }

  /* Overlay */
  #overlay {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at center, rgba(20,15,40,0.95), rgba(0,0,0,0.98));
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    text-align: center;
    padding: 32px;
    overflow-y: auto;
    z-index: 5;
  }
  #overlay::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,0.025) 3px 4px);
    pointer-events: none;
  }
  #overlay.hidden { display: none; }
  #overlay > * { position: relative; z-index: 1; }

  .title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 72px;
    line-height: 0.95;
    margin: 0 0 4px;
    letter-spacing: -1px;
    background: linear-gradient(180deg, #fff 30%, var(--neon-yellow) 70%, var(--neon-pink) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 60px rgba(255,210,63,0.3);
  }
  .subtitle {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--neon-cyan);
    margin: 8px 0 24px;
    text-transform: uppercase;
  }
  .heading {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 42px;
    margin: 0 0 8px;
    letter-spacing: -1px;
  }
  .desc {
    color: #aaa;
    margin: 6px 0;
    line-height: 1.7;
    max-width: 540px;
  }
  .ctrls {
    margin-top: 24px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #666;
    letter-spacing: 1px;
    line-height: 2;
  }
  .ctrls kbd {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    padding: 3px 7px;
    border-radius: 4px;
    color: var(--neon-yellow);
    font-family: inherit;
    font-size: inherit;
    margin: 0 2px;
  }

  .btn {
    padding: 14px 32px;
    background: var(--neon-yellow);
    color: #000;
    border: none;
    border-radius: 6px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    margin: 8px;
    letter-spacing: 0.5px;
    transition: all 0.15s;
    box-shadow: 0 4px 0 #c89c0a, 0 8px 20px rgba(255,210,63,0.3);
  }
  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #c89c0a, 0 12px 24px rgba(255,210,63,0.4);
  }
  .btn:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #c89c0a;
  }
  .btn:disabled {
    background: #444;
    color: #888;
    box-shadow: 0 4px 0 #222;
    cursor: not-allowed;
  }
  .btn.alt {
    background: transparent;
    color: #fff;
    border: 2px solid rgba(255,255,255,0.2);
    box-shadow: none;
  }
  .btn.alt:hover {
    border-color: var(--neon-cyan);
    color: var(--neon-cyan);
    box-shadow: 0 0 20px rgba(61,223,255,0.3);
  }
  .btn.danger {
    background: var(--neon-pink);
    color: #fff;
    box-shadow: 0 4px 0 #b1175d, 0 8px 20px rgba(255,59,139,0.3);
  }

  /* Loadout */
  .weapon-pick {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin: 24px 0;
    max-width: 760px;
    width: 100%;
  }
  .pick-card {
    padding: 16px 14px;
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    position: relative;
    overflow: hidden;
  }
  .pick-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 60%, rgba(255,210,63,0.08));
    opacity: 0;
    transition: opacity 0.15s;
  }
  .pick-card:hover {
    border-color: rgba(255,210,63,0.5);
    transform: translateY(-2px);
  }
  .pick-card:hover::before { opacity: 1; }
  .pick-card.selected {
    border-color: var(--neon-yellow);
    background: rgba(255,210,63,0.08);
    box-shadow: 0 0 20px rgba(255,210,63,0.2);
  }
  .pick-card.selected::before { opacity: 1; }
  .pick-card .num {
    position: absolute;
    top: 8px;
    right: 10px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--neon-yellow);
    opacity: 0;
    transition: opacity 0.15s;
  }
  .pick-card.selected .num { opacity: 1; }
  .pick-card .nm {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 22px;
    line-height: 1;
    margin-bottom: 6px;
  }
  .pick-card .stats {
    font-size: 11px;
    color: #888;
    line-height: 1.6;
    font-family: 'Press Start 2P', monospace;
    letter-spacing: 0;
  }
  .selection-count {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--neon-cyan);
    letter-spacing: 2px;
    margin: 12px 0;
  }

  /* Shop */
  .shop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 10px;
    max-width: 820px;
    margin: 18px 0;
    width: 100%;
  }
  .shop-card {
    padding: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    text-align: left;
    position: relative;
  }
  .shop-card.owned { opacity: 0.5; }
  .shop-card .nm {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 24px;
    line-height: 1;
  }
  .shop-card .meta {
    font-size: 11px;
    color: #888;
    margin: 6px 0 10px;
    font-family: 'Press Start 2P', monospace;
  }
  .shop-card .price {
    color: var(--neon-yellow);
    font-weight: 700;
    font-size: 14px;
    margin-right: 8px;
  }
  .shop-card button {
    margin-top: 4px;
    padding: 6px 14px;
    background: var(--neon-yellow);
    color: #000;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 700;
    font-family: 'IBM Plex Sans KR', sans-serif;
  }
  .shop-card button:disabled {
    background: #333;
    color: #666;
    cursor: not-allowed;
  }

  .key-display {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--neon-yellow);
    letter-spacing: 1px;
  }

  /* Banner */
  .event-banner {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(90deg, var(--neon-pink), var(--neon-yellow));
    color: #000;
    padding: 10px 24px;
    border-radius: 24px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 18px;
    box-shadow: 0 0 40px rgba(255,210,63,0.6);
    animation: bannerIn 0.4s ease-out, bannerPulse 1s ease-in-out 0.4s infinite;
    z-index: 3;
  }
  @keyframes bannerIn {
    from { transform: translate(-50%, -20px); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
  }
  @keyframes bannerPulse {
    50% { transform: translate(-50%, 0) scale(1.04); }
  }

  .kill-feed {
    position: absolute;
    top: 90px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    pointer-events: none;
    z-index: 2;
  }
  .kill-msg {
    background: rgba(10,10,20,0.85);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
    animation: killFade 3s forwards;
    font-weight: 500;
  }
  @keyframes killFade {
    0% { opacity: 0; transform: translateX(20px); }
    10%, 70% { opacity: 1; transform: translateX(0); }
    100% { opacity: 0; }
  }

  /* Responsive */
  @media (max-width: 920px) {
    #stage { width: 100%; height: 65vh; }
    .title { font-size: 56px; }
    .heading { font-size: 32px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" width="900" height="600"></canvas>
    <div id="hud"></div>
    <div id="weapons-bar"></div>
    <div class="kill-feed" id="killFeed"></div>
    <div id="overlay"></div>
  </div>
</div>
<script>
'use strict';

// ============================================================
// 은우 은우 게임 — Web Edition
// 원본 Roblox 스크립트의 시스템을 모두 보존:
//  • 키 시스템 / 상점 / 시작 무기 4개 선택
//  • 체력 150 / 맵 확률 / 팀 / 5킬 승리 / 이벤트 무기
// ============================================================

const W = 900, H = 600;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const overlay = document.getElementById('overlay');
const hud = document.getElementById('hud');
const weaponsBar = document.getElementById('weapons-bar');
const killFeed = document.getElementById('killFeed');
const stage = document.getElementById('stage');

// ---------- 데이터 ----------
const WEAPONS = {
  AssaultRifle: { ko: '돌격소총', dmg: 15, fr: 130, sp: 9, col: '#bbb', kind: 'gun' },
  Bow:          { ko: '활',       dmg: 40, fr: 700, sp: 7, col: '#a86a3a', kind: 'gun' },
  RepairBullet: { ko: '회복탄',   dmg: 0,  fr: 1800, sp: 0, col: '#5f5', kind: 'heal', heal: 35 },
  Pistol:       { ko: '권총',     dmg: 20, fr: 350, sp: 8, col: '#999', kind: 'gun' },
  Grenade:      { ko: '수류탄',   dmg: 70, fr: 1300, sp: 5, col: '#5b5', kind: 'aoe', radius: 75, fuse: 800 },

  AK47:        { ko: 'AK-47',     dmg: 22, fr: 90,   sp: 10, col: '#d9a040', kind: 'gun',     price: 3 },
  Shotgun:     { ko: '샷건',       dmg: 11, fr: 700,  sp: 8,  col: '#888',    kind: 'shotgun', pellets: 6, price: 2 },
  Sniper:      { ko: '저격총',     dmg: 100, fr: 1400, sp: 18, col: '#4d9fff', kind: 'gun',    price: 5 },
  Sword:       { ko: '검',         dmg: 80,  fr: 450,  sp: 0,  col: '#ddd',    kind: 'melee', range: 60, price: 1 },
  SMG:         { ko: '기관단총',   dmg: 9,   fr: 60,   sp: 11, col: '#aaa',    kind: 'gun',    price: 2 },
  Minigun:     { ko: '미니건',     dmg: 7,   fr: 40,   sp: 9,  col: '#666',    kind: 'gun',    price: 4 },
  LMG:         { ko: '경기관총',   dmg: 18,  fr: 110,  sp: 9,  col: '#5a7a3a', kind: 'gun',    price: 4 },
  Magnum:      { ko: '매그넘',     dmg: 45,  fr: 600,  sp: 12, col: '#c97a3a', kind: 'gun',    price: 3 },
  DesertEagle: { ko: '데저트이글', dmg: 35,  fr: 450,  sp: 11, col: '#d4af37', kind: 'gun',    price: 2 },
  AntiTank:    { ko: '대물저격총', dmg: 180, fr: 2200, sp: 22, col: '#7a4a8c', kind: 'gun',    pierce: true, price: 8 },
  AutoShotgun: { ko: '자동샷건',   dmg: 9,   fr: 380,  sp: 8,  col: '#a76',    kind: 'shotgun', pellets: 5, price: 4 },
  DoubleBarrel:{ ko: '더블배럴',   dmg: 14,  fr: 1100, sp: 8,  col: '#7a5538', kind: 'shotgun', pellets: 8, price: 3 },
  PlasmaRifle: { ko: '플라즈마',   dmg: 25,  fr: 140,  sp: 12, col: '#5fff8f', kind: 'gun',    price: 4 },
  RailGun:     { ko: '레일건',     dmg: 75,  fr: 1600, sp: 30, col: '#9f5fff', kind: 'gun',    pierce: true, price: 6 },
  Flamethrower:{ ko: '화염방사기', dmg: 6,   fr: 35,   sp: 7,  col: '#ff7733', kind: 'gun',    price: 4 },
  IceCannon:   { ko: '얼음대포',   dmg: 32,  fr: 380,  sp: 9,  col: '#8fdfff', kind: 'gun',    price: 3 },
  Crossbow:    { ko: '석궁',       dmg: 55,  fr: 500,  sp: 14, col: '#967846', kind: 'gun',    pierce: true, price: 3 },
  Katana:      { ko: '카타나',     dmg: 50,  fr: 250,  sp: 0,  col: '#fff8c0', kind: 'melee', range: 55, price: 2 },
  WarHammer:   { ko: '워해머',     dmg: 130, fr: 900,  sp: 0,  col: '#a87858', kind: 'melee', range: 70, price: 4 },
  Spear:       { ko: '창',         dmg: 60,  fr: 500,  sp: 0,  col: '#cdb78a', kind: 'melee', range: 90, price: 3 },
  RocketLauncher:{ ko: '로켓런처', dmg: 90,  fr: 1500, sp: 7,  col: '#bb4422', kind: 'aoe', radius: 90, fuse: 2000, price: 5 },
  StickyBomb:  { ko: '점착폭탄',   dmg: 80,  fr: 1200, sp: 6,  col: '#88ff44', kind: 'aoe', radius: 70, fuse: 1500, price: 3 },
  MedKit:      { ko: '구급상자',   dmg: 0,   fr: 2500, sp: 0,  col: '#5fff8f', kind: 'heal', heal: 75, price: 2 },

  GoldenRifle: { ko: '황금소총', dmg: 30, fr: 80, sp: 11, col: '#ffd23f', kind: 'gun', event: true },
  LaserGun:    { ko: '레이저건', dmg: 28, fr: 55, sp: 25, col: '#ff3b8b', kind: 'gun', event: true },
  UltraBow:    { ko: '울트라활', dmg: 70, fr: 500, sp: 13, col: '#3ddfff', kind: 'gun', event: true, pierce: true }
};

const MAPS = {
  Desert:  { weight: 30, ko: '사막',   bg: '#c89968', obs: '#7a5a35', accent: '#a8804f' },
  City:    { weight: 20, ko: '도시',   bg: '#4a4a55', obs: '#1a1a22', accent: '#2e2e3a' },
  Snow:    { weight: 12, ko: '설원',   bg: '#dde8f0', obs: '#7a93a8', accent: '#b8c8d6' },
  Space:   { weight: 5,  ko: '우주',   bg: '#0a0820', obs: '#4a3a7a', accent: '#1a1535' },
  Forest:  { weight: 15, ko: '숲',     bg: '#3a5a3a', obs: '#5a3a1a', accent: '#5a7a4a' },
  Lava:    { weight: 8,  ko: '용암',   bg: '#3a1a0a', obs: '#1a0808', accent: '#dd6a2a' },
  Castle:  { weight: 12, ko: '성',     bg: '#5a5550', obs: '#2a2520', accent: '#7a7570' },
  Jungle:  { weight: 10, ko: '정글',   bg: '#1a3a2a', obs: '#0a1a0a', accent: '#3a6a4a' },
  Factory: { weight: 10, ko: '공장',   bg: '#2a2a35', obs: '#5a5a4a', accent: '#3a3a4a' },
  Neon:    { weight: 6,  ko: '네온',   bg: '#0a0815', obs: '#2a1a4a', accent: '#ff3b8b' },
  Beach:   { weight: 12, ko: '해변',   bg: '#e8d8a0', obs: '#7a5a3a', accent: '#8fc0e0' }
};

const STARTER = ['AssaultRifle', 'Bow', 'RepairBullet', 'Pistol', 'Grenade'];
const SHOP_ITEMS = [
  'Sword', 'Shotgun', 'SMG', 'DesertEagle', 'MedKit',
  'AK47', 'Magnum', 'IceCannon', 'Crossbow', 'DoubleBarrel', 'StickyBomb', 'Katana', 'Spear',
  'Sniper', 'LMG', 'Minigun', 'Flamethrower', 'PlasmaRifle', 'AutoShotgun', 'WarHammer', 'RocketLauncher',
  'RailGun', 'AntiTank'
];
const EVENT_WEAPONS = ['GoldenRifle', 'LaserGun', 'UltraBow'];

const WIN_KILLS = 5;
const EVENT_INTERVAL = 30000;
const MAX_HP = 150;
const TEAM_SIZE = 3; // 3v3

// ---------- 게임 상태 ----------
let state = 'menu';
let player = null;
let bots = [];
let bullets = [];
let particles = [];
let obstacles = [];
let currentMap = null;
let mapName = 'Desert';
let lastEventTime = 0;
let totalKeys = 0;
let purchased = new Set();
let loadout = [];
let activeSlot = 0;
let lastShot = {};
let mouseX = 0, mouseY = 0, mouseDown = false;
let keys = {};
let lastFrame = performance.now();
let screenShake = 0;

// ============================================================
// 상태 화면
// ============================================================
function showMenu() {
  state = 'menu';
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h1 class="title">은우 은우 게임</h1>
    <div class="subtitle">3v3 Team Deathmatch</div>
    <p class="desc">먼저 5킬을 달성하는 팀이 승리합니다. 킬을 올리면 🗝️ 열쇠를 얻고, 열쇠로 더 강한 무기를 살 수 있습니다. 30초마다 모든 플레이어에게 이벤트 무기가 지급됩니다.</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px">
      <button class="btn" id="startBtn">전투 시작</button>
      ${totalKeys > 0 ? `<button class="btn alt" id="shopBtn">상점 (🗝️ ${totalKeys})</button>` : ''}
    </div>
    <div class="ctrls">
      <kbd>WASD</kbd> 이동 &nbsp;·&nbsp; <kbd>마우스</kbd> 조준 &nbsp;·&nbsp; <kbd>클릭</kbd> 발사 &nbsp;·&nbsp; <kbd>1</kbd>~<kbd>4</kbd> 무기
    </div>
  `;
  document.getElementById('startBtn').onclick = goLoadout;
  if (totalKeys > 0) document.getElementById('shopBtn').onclick = showShop;
}

function goLoadout() {
  state = 'loadout';
  loadout = [];
  renderLoadout();
}

function renderLoadout() {
  const all = [...STARTER, ...SHOP_ITEMS.filter(w => purchased.has(w))];
  const cards = all.map(w => {
    const wp = WEAPONS[w];
    const sel = loadout.indexOf(w);
    let stat;
    if (wp.kind === 'heal') stat = `회복 ${wp.heal}`;
    else if (wp.kind === 'melee') stat = `근접 ${wp.dmg}`;
    else if (wp.kind === 'aoe') stat = `폭발 ${wp.dmg}`;
    else if (wp.kind === 'shotgun') stat = `${wp.pellets}발 × ${wp.dmg}`;
    else stat = `Dmg ${wp.dmg}`;
    return `<div class="pick-card ${sel >= 0 ? 'selected' : ''}" data-w="${w}">
      ${sel >= 0 ? `<div class="num">${sel+1}</div>` : ''}
      <div class="nm" style="color:${wp.col}">${wp.ko}</div>
      <div class="stats">${stat}<br>FR ${wp.fr}ms</div>
    </div>`;
  }).join('');

  overlay.innerHTML = `
    <h2 class="heading">무기 선택</h2>
    <p class="desc">전투에 가져갈 무기 4개를 선택하세요.</p>
    <div class="weapon-pick">${cards}</div>
    <div class="selection-count">${loadout.length} / 4</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <button class="btn" id="goBtn" ${loadout.length === 4 ? '' : 'disabled'}>전투 시작</button>
      <button class="btn alt" id="backBtn">뒤로</button>
    </div>
  `;
  overlay.querySelectorAll('.pick-card').forEach(el => {
    el.onclick = () => toggleLoadout(el.dataset.w);
  });
  const go = document.getElementById('goBtn');
  if (go) go.onclick = startMatch;
  document.getElementById('backBtn').onclick = showMenu;
}

function toggleLoadout(w) {
  const i = loadout.indexOf(w);
  if (i >= 0) loadout.splice(i, 1);
  else if (loadout.length < 4) loadout.push(w);
  renderLoadout();
}

function showShop() {
  state = 'shop';
  const cards = SHOP_ITEMS.map(w => {
    const wp = WEAPONS[w];
    const owned = purchased.has(w);
    const canBuy = totalKeys >= wp.price && !owned;
    let meta;
    if (wp.kind === 'heal') meta = `HEAL ${wp.heal} · CD ${wp.fr}ms`;
    else if (wp.kind === 'melee') meta = `근접 ${wp.dmg} · 사거리 ${wp.range}`;
    else if (wp.kind === 'aoe') meta = `폭발 ${wp.dmg} · R${wp.radius}`;
    else if (wp.kind === 'shotgun') meta = `${wp.pellets}발 × ${wp.dmg} · FR ${wp.fr}ms`;
    else meta = `DMG ${wp.dmg} · FR ${wp.fr}ms${wp.pierce ? ' · 관통' : ''}`;
    return `<div class="shop-card ${owned ? 'owned' : ''}">
      <div class="nm" style="color:${wp.col}">${wp.ko}</div>
      <div class="meta">${meta}</div>
      <span class="price">🗝️ ${wp.price}</span>
      <button data-w="${w}" ${canBuy ? '' : 'disabled'}>${owned ? '보유 중' : '구매'}</button>
    </div>`;
  }).join('');
  overlay.innerHTML = `
    <h2 class="heading">상점</h2>
    <div class="key-display">보유 🗝️ ${totalKeys}</div>
    <div class="shop-grid">${cards}</div>
    <p class="desc" style="font-size:13px">상점 무기는 다음 전투의 무기 선택 화면에서 함께 표시됩니다.</p>
    <button class="btn alt" id="backBtn">뒤로</button>
  `;
  overlay.querySelectorAll('.shop-card button').forEach(b => {
    b.onclick = () => buy(b.dataset.w);
  });
  document.getElementById('backBtn').onclick = showMenu;
}

function buy(w) {
  const wp = WEAPONS[w];
  if (totalKeys >= wp.price && !purchased.has(w)) {
    totalKeys -= wp.price;
    purchased.add(w);
    showShop();
  }
}

// ============================================================
// 매치 시작
// ============================================================
function startMatch() {
  state = 'playing';
  overlay.classList.add('hidden');
  mapName = chooseMap();
  currentMap = MAPS[mapName];
  obstacles = generateObstacles(mapName);

  player = makeEntity(120, H/2, 'blue', 'You', false);
  player.weapons = [...loadout];
  player.activeWeapon = loadout[0];
  activeSlot = 0;

  bots = [];
  for (let i = 0; i < TEAM_SIZE - 1; i++) {
    const b = makeEntity(80 + i*40, H/2 - 100 + i*60, 'blue', '아군' + (i+1), true);
    b.weapons = randomLoadout();
    b.activeWeapon = b.weapons[0];
    bots.push(b);
  }
  for (let i = 0; i < TEAM_SIZE; i++) {
    const b = makeEntity(W - 120 - i*30, H/2 - 100 + i*80, 'red', '적군' + (i+1), true);
    b.weapons = randomLoadout();
    b.activeWeapon = b.weapons[0];
    bots.push(b);
  }

  bullets = [];
  particles = [];
  lastShot = {};
  player.kills = 0;
  bots.forEach(b => b.kills = 0);
  lastEventTime = performance.now();

  showEventBanner(`🗺️ ${currentMap.ko} 맵`);
  lastFrame = performance.now();
  requestAnimationFrame(loop);
}

function chooseMap() {
  const total = Object.values(MAPS).reduce((s, m) => s + m.weight, 0);
  let r = Math.random() * total;
  for (const [name, m] of Object.entries(MAPS)) {
    r -= m.weight;
    if (r <= 0) return name;
  }
  return 'Desert';
}

function generateObstacles(name) {
  const obs = [];
  const tryAdd = (o) => {
    // keep clear of spawns
    if (o.x < 200 && o.y > H/2 - 120 && o.y < H/2 + 120) return;
    if (o.x + o.w > W - 200 && o.y > H/2 - 120 && o.y < H/2 + 120) return;
    obs.push(o);
  };
  if (name === 'Desert') {
    for (let i = 0; i < 14; i++) {
      const r = 22 + Math.random() * 18;
      tryAdd({ x: 100 + Math.random()*(W-200), y: 80 + Math.random()*(H-160), w: r*2, h: r*2, shape: 'circle' });
    }
  } else if (name === 'City') {
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 5; col++) {
        if (Math.random() > 0.32) {
          tryAdd({
            x: 130 + col*140 + Math.random()*20,
            y: 90 + row*150 + Math.random()*20,
            w: 60 + Math.random()*30,
            h: 60 + Math.random()*30,
            shape: 'rect'
          });
        }
      }
    }
  } else if (name === 'Snow') {
    for (let i = 0; i < 9; i++) {
      const r = 24 + Math.random() * 14;
      tryAdd({ x: 150 + Math.random()*(W-300), y: 100 + Math.random()*(H-200), w: r*2, h: r*2, shape: 'circle' });
    }
  } else if (name === 'Space') {
    for (let i = 0; i < 11; i++) {
      const r = 26 + Math.random() * 22;
      tryAdd({ x: 120 + Math.random()*(W-240), y: 80 + Math.random()*(H-160), w: r*2, h: r*2, shape: 'circle' });
    }
  } else if (name === 'Forest') {
    // 빽빽한 나무 - 작은 원들
    for (let i = 0; i < 22; i++) {
      const r = 16 + Math.random() * 14;
      tryAdd({ x: 100 + Math.random()*(W-200), y: 70 + Math.random()*(H-140), w: r*2, h: r*2, shape: 'circle' });
    }
  } else if (name === 'Lava') {
    // 큼지막한 용암 바위 몇 덩어리
    for (let i = 0; i < 8; i++) {
      const r = 32 + Math.random() * 24;
      tryAdd({ x: 130 + Math.random()*(W-260), y: 90 + Math.random()*(H-180), w: r*2, h: r*2, shape: 'circle' });
    }
  } else if (name === 'Castle') {
    // 성벽 - 큰 사각 + 작은 탑
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 4; col++) {
        if (Math.random() > 0.4) {
          tryAdd({
            x: 160 + col*160 + Math.random()*15,
            y: 100 + row*150 + Math.random()*15,
            w: 50 + Math.random()*40,
            h: 70 + Math.random()*50,
            shape: 'rect'
          });
        }
      }
    }
    // 탑 (원형)
    for (let i = 0; i < 4; i++) {
      const r = 22 + Math.random() * 8;
      tryAdd({ x: 150 + Math.random()*(W-300), y: 100 + Math.random()*(H-200), w: r*2, h: r*2, shape: 'circle' });
    }
  } else if (name === 'Jungle') {
    // 매우 빽빽한 정글
    for (let i = 0; i < 28; i++) {
      const r = 14 + Math.random() * 16;
      tryAdd({ x: 90 + Math.random()*(W-180), y: 70 + Math.random()*(H-140), w: r*2, h: r*2, shape: 'circle' });
    }
  } else if (name === 'Factory') {
    // 컨테이너(사각) + 파이프(원) 혼합
    for (let i = 0; i < 8; i++) {
      tryAdd({
        x: 130 + Math.random()*(W-260),
        y: 100 + Math.random()*(H-200),
        w: 50 + Math.random()*50,
        h: 40 + Math.random()*40,
        shape: 'rect'
      });
    }
    for (let i = 0; i < 6; i++) {
      const r = 18 + Math.random() * 12;
      tryAdd({ x: 150 + Math.random()*(W-300), y: 100 + Math.random()*(H-200), w: r*2, h: r*2, shape: 'circle' });
    }
  } else if (name === 'Neon') {
    // 네온 도시 - 적은 키 큰 빌딩
    for (let i = 0; i < 7; i++) {
      tryAdd({
        x: 150 + Math.random()*(W-300),
        y: 90 + Math.random()*(H-180),
        w: 45 + Math.random()*55,
        h: 60 + Math.random()*60,
        shape: 'rect'
      });
    }
  } else if (name === 'Beach') {
    // 듬성듬성한 바위
    for (let i = 0; i < 7; i++) {
      const r = 22 + Math.random() * 16;
      tryAdd({ x: 150 + Math.random()*(W-300), y: 100 + Math.random()*(H-200), w: r*2, h: r*2, shape: 'circle' });
    }
  }
  return obs;
}

function makeEntity(x, y, team, name, isBot) {
  return {
    x, y, team, name, isBot,
    hp: MAX_HP, maxHp: MAX_HP,
    radius: 14, angle: 0, kills: 0,
    weapons: [], activeWeapon: null,
    aiState: 'wander', aiTimer: 0, wanderDir: { x: 0, y: 0 },
    dead: false, respawnAt: 0,
    lastDamageTime: 0
  };
}

function randomLoadout() {
  const pool = [...STARTER];
  const arr = [];
  for (let i = 0; i < 4 && pool.length; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    arr.push(pool.splice(idx, 1)[0]);
  }
  return arr;
}

// ============================================================
// 게임 루프
// ============================================================
function loop(now) {
  if (state !== 'playing') return;
  const dt = Math.min(50, now - lastFrame);
  lastFrame = now;
  update(dt, now);
  render();
  requestAnimationFrame(loop);
}

function update(dt, now) {
  // 이벤트 타이머
  if (now - lastEventTime > EVENT_INTERVAL) {
    triggerEvent();
    lastEventTime = now;
  }

  updatePlayer(dt, now);
  bots.forEach(b => updateBot(b, dt, now));
  updateBullets(dt);
  updateParticles(dt);

  bots.forEach(b => {
    if (b.dead && now > b.respawnAt) respawnEntity(b);
  });
  if (player.dead && now > player.respawnAt) respawnEntity(player);

  if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 0.01);

  // 승리 판정
  const blueKills = teamKills('blue');
  const redKills = teamKills('red');
  if (blueKills >= WIN_KILLS) endMatch(true);
  else if (redKills >= WIN_KILLS) endMatch(false);
}

function teamKills(team) {
  let s = 0;
  if (player.team === team) s += player.kills;
  for (const b of bots) if (b.team === team) s += b.kills;
  return s;
}

function updatePlayer(dt, now) {
  if (player.dead) return;
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  const len = Math.hypot(dx, dy);
  if (len > 0) { dx /= len; dy /= len; }
  const sp = 3.5 * dt / 16.67;
  tryMove(player, dx * sp, dy * sp);
  player.angle = Math.atan2(mouseY - player.y, mouseX - player.x);
  if (mouseDown) tryShoot(player, now);
}

function tryMove(e, dx, dy) {
  if (!collides(e.x + dx, e.y, e.radius)) e.x += dx;
  if (!collides(e.x, e.y + dy, e.radius)) e.y += dy;
  e.x = Math.max(e.radius, Math.min(W - e.radius, e.x));
  e.y = Math.max(e.radius, Math.min(H - e.radius, e.y));
}

function collides(x, y, r) {
  for (const o of obstacles) {
    if (o.shape === 'circle') {
      const cx = o.x + o.w/2, cy = o.y + o.h/2;
      if (Math.hypot(x - cx, y - cy) < o.w/2 + r) return true;
    } else {
      if (x + r > o.x && x - r < o.x + o.w && y + r > o.y && y - r < o.y + o.h) return true;
    }
  }
  return false;
}

function lineOfSight(x1, y1, x2, y2) {
  const steps = 16;
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t;
    for (const o of obstacles) {
      if (o.shape === 'circle') {
        if (Math.hypot(x - (o.x + o.w/2), y - (o.y + o.h/2)) < o.w/2) return false;
      } else {
        if (x > o.x && x < o.x + o.w && y > o.y && y < o.y + o.h) return false;
      }
    }
  }
  return true;
}

function updateBot(bot, dt, now) {
  if (bot.dead) return;
  const enemies = [player, ...bots].filter(p => p.team !== bot.team && !p.dead);
  let target = null, minDist = Infinity;
  for (const e of enemies) {
    const d = Math.hypot(e.x - bot.x, e.y - bot.y);
    if (d < minDist) { minDist = d; target = e; }
  }

  bot.aiTimer -= dt;
  if (bot.aiTimer <= 0) {
    if (target) {
      const visible = lineOfSight(bot.x, bot.y, target.x, target.y);
      if (visible && minDist < 360) bot.aiState = 'attack';
      else bot.aiState = 'pursue';
    } else {
      bot.aiState = 'wander';
    }
    bot.aiTimer = 200 + Math.random() * 250;

    // 가끔 무기 교체로 다양성
    if (Math.random() < 0.3 && bot.weapons.length > 0) {
      bot.activeWeapon = bot.weapons[Math.floor(Math.random() * bot.weapons.length)];
    }
  }

  let mx = 0, my = 0;
  if (bot.aiState === 'wander' || !target) {
    if (Math.random() < 0.02 || (bot.wanderDir.x === 0 && bot.wanderDir.y === 0)) {
      const a = Math.random() * Math.PI * 2;
      bot.wanderDir = { x: Math.cos(a), y: Math.sin(a) };
    }
    mx = bot.wanderDir.x * 0.55;
    my = bot.wanderDir.y * 0.55;
  } else if (bot.aiState === 'pursue') {
    const a = Math.atan2(target.y - bot.y, target.x - bot.x);
    mx = Math.cos(a); my = Math.sin(a);
    bot.angle = a;
  } else if (bot.aiState === 'attack') {
    bot.angle = Math.atan2(target.y - bot.y, target.x - bot.x);
    // 사이드 스텝
    const sa = bot.angle + Math.PI/2;
    const dir = Math.sin(now / 250 + bot.x) > 0 ? 1 : -1;
    mx = Math.cos(sa) * 0.7 * dir;
    my = Math.sin(sa) * 0.7 * dir;
    if (minDist < 110) {
      mx -= Math.cos(bot.angle) * 0.6;
      my -= Math.sin(bot.angle) * 0.6;
    } else if (minDist > 300) {
      mx += Math.cos(bot.angle) * 0.4;
      my += Math.sin(bot.angle) * 0.4;
    }
    tryShoot(bot, now);
  }
  const sp = 2.5 * dt / 16.67;
  tryMove(bot, mx * sp, my * sp);
}

// ============================================================
// 발사
// ============================================================
function tryShoot(p, now) {
  const w = p.activeWeapon;
  if (!w) return;
  const wp = WEAPONS[w];
  if (!wp) return;
  // 적군(red) 봇 너프: 조준 흔들림 + 느린 발사 + 낮은 피해
  const isEnemy = p.isBot && p.team === 'red';
  const aimError = isEnemy ? (Math.random() - 0.5) * 0.18 : 0;
  const dmgMult  = isEnemy ? 0.75 : 1;
  const frMult   = isEnemy ? 1.35 : 1;
  const key = p.name;
  if ((lastShot[key] || 0) + wp.fr * frMult > now) return;
  lastShot[key] = now;

  if (wp.kind === 'heal') {
    p.hp = Math.min(p.maxHp, p.hp + wp.heal);
    spawnHealParticles(p);
    return;
  }
  if (wp.kind === 'melee') {
    const range = wp.range;
    const enemies = [player, ...bots].filter(e => e.team !== p.team && !e.dead);
    let hitAny = false;
    for (const e of enemies) {
      const dx = e.x - p.x, dy = e.y - p.y;
      const d = Math.hypot(dx, dy);
      if (d <= range + e.radius) {
        const ang = Math.atan2(dy, dx);
        let diff = Math.abs(((ang - p.angle + Math.PI) % (Math.PI*2)) - Math.PI);
        if (diff < Math.PI / 2.5) {
          dealDamage(e, wp.dmg * dmgMult, p);
          spawnHitParticles(e.x, e.y, '#fff');
          hitAny = true;
        }
      }
    }
    spawnSwingParticles(p);
    if (hitAny && p === player) screenShake = 4;
    return;
  }
  if (wp.kind === 'shotgun') {
    for (let i = 0; i < wp.pellets; i++) {
      const a = p.angle + aimError + (Math.random() - 0.5) * 0.5;
      const b = makeBullet(p, a, wp);
      b.dmg *= dmgMult;
      bullets.push(b);
    }
    return;
  }
  if (wp.kind === 'aoe') {
    const b = makeBullet(p, p.angle + aimError, wp);
    b.isAoe = true;
    b.fuse = wp.fuse;
    b.life = wp.fuse;
    b.aoeRadius = wp.radius;
    b.dmg *= dmgMult;
    bullets.push(b);
    return;
  }
  const b = makeBullet(p, p.angle + aimError, wp);
  b.dmg *= dmgMult;
  bullets.push(b);
}

function makeBullet(owner, angle, wp) {
  return {
    x: owner.x + Math.cos(angle) * 18,
    y: owner.y + Math.sin(angle) * 18,
    vx: Math.cos(angle) * wp.sp,
    vy: Math.sin(angle) * wp.sp,
    dmg: wp.dmg,
    radius: 4,
    color: wp.col,
    team: owner.team,
    owner,
    pierce: !!wp.pierce,
    hit: new Set(),
    life: 1500
  };
}

function updateBullets(dt) {
  const k = dt / 16.67;
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;
    if (b.life <= 0) {
      if (b.isAoe) explode(b);
      bullets.splice(i, 1);
      continue;
    }
    b.x += b.vx * k;
    b.y += b.vy * k;
    if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) {
      if (b.isAoe) explode(b);
      bullets.splice(i, 1);
      continue;
    }
    if (collides(b.x, b.y, b.radius)) {
      if (b.isAoe) explode(b);
      else spawnHitParticles(b.x, b.y, b.color);
      bullets.splice(i, 1);
      continue;
    }
    let removed = false;
    const targets = [player, ...bots];
    for (const e of targets) {
      if (e.dead || e.team === b.team) continue;
      if (b.hit.has(e)) continue;
      const d = Math.hypot(b.x - e.x, b.y - e.y);
      if (d < e.radius + b.radius) {
        dealDamage(e, b.dmg, b.owner);
        spawnHitParticles(b.x, b.y, b.color);
        b.hit.add(e);
        if (!b.pierce) {
          if (b.isAoe) explode(b);
          bullets.splice(i, 1);
          removed = true;
        }
        break;
      }
    }
    if (removed) continue;
  }
}

function explode(b) {
  const r = b.aoeRadius || WEAPONS.Grenade.radius;
  const targets = [player, ...bots];
  for (const e of targets) {
    if (e.dead || e.team === b.team) continue;
    const d = Math.hypot(b.x - e.x, b.y - e.y);
    if (d < r + e.radius) {
      const factor = 1 - (d / (r + e.radius)) * 0.5;
      dealDamage(e, b.dmg * factor, b.owner);
    }
  }
  spawnExplosion(b.x, b.y, true);
  if (Math.hypot(b.x - player.x, b.y - player.y) < 200) screenShake = 8;
}

function dealDamage(e, dmg, attacker) {
  if (e.dead) return;
  e.hp -= dmg;
  e.lastDamageTime = performance.now();
  if (e.hp <= 0) {
    e.dead = true;
    e.respawnAt = performance.now() + (e === player ? 4000 : 3000);
    if (attacker && attacker !== e) {
      attacker.kills = (attacker.kills || 0) + 1;
      if (attacker === player) totalKeys += 1;
      pushKillMsg(attacker, e);
      spawnExplosion(e.x, e.y, false);
    }
    if (e === player) screenShake = 12;
  }
}

function respawnEntity(e) {
  if (e === player) {
    e.x = 120; e.y = H/2 + (Math.random() - 0.5) * 100;
  } else if (e.team === 'blue') {
    e.x = 60 + Math.random() * 80;
    e.y = H/2 + (Math.random() - 0.5) * 200;
  } else {
    e.x = W - 60 - Math.random() * 80;
    e.y = H/2 + (Math.random() - 0.5) * 200;
  }
  e.hp = e.maxHp;
  e.dead = false;
  if (e.weapons && e.weapons.length) {
    e.activeWeapon = e.weapons[Math.floor(Math.random() * e.weapons.length)];
  }
}

function pushKillMsg(killer, victim) {
  const div = document.createElement('div');
  div.className = 'kill-msg';
  const kCol = killer.team === 'blue' ? 'var(--neon-cyan)' : 'var(--neon-red)';
  const vCol = victim.team === 'blue' ? 'var(--neon-cyan)' : 'var(--neon-red)';
  const kName = killer === player ? 'You' : killer.name;
  const vName = victim === player ? 'You' : victim.name;
  div.innerHTML = `<span style="color:${kCol}">${kName}</span> 💥 <span style="color:${vCol}">${vName}</span>`;
  killFeed.appendChild(div);
  setTimeout(() => div.remove(), 3000);
}

// ============================================================
// 파티클
// ============================================================
function updateParticles(dt) {
  const k = dt / 16.67;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * k;
    p.y += p.vy * k;
    p.vx *= 0.93; p.vy *= 0.93;
  }
}
function spawnHitParticles(x, y, col) {
  for (let i = 0; i < 5; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 300, maxLife: 300, color: col, size: 3 });
  }
}
function spawnExplosion(x, y, big) {
  const n = big ? 22 : 14;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 2 + Math.random() * 5;
    const col = ['#ffd23f', '#ff8800', '#ff4444'][Math.floor(Math.random()*3)];
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 600, maxLife: 600, color: col, size: 5 });
  }
}
function spawnHealParticles(p) {
  for (let i = 0; i < 8; i++) {
    particles.push({ x: p.x, y: p.y, vx: (Math.random()-0.5)*1.5, vy: -1 - Math.random()*2, life: 600, maxLife: 600, color: '#5f5', size: 4 });
  }
}
function spawnSwingParticles(p) {
  for (let i = -3; i <= 3; i++) {
    const a = p.angle + i * 0.18;
    particles.push({ x: p.x + Math.cos(a)*45, y: p.y + Math.sin(a)*45, vx: Math.cos(a)*1, vy: Math.sin(a)*1, life: 220, maxLife: 220, color: '#fff', size: 3 });
  }
}

// ============================================================
// 렌더
// ============================================================
function render() {
  ctx.save();
  if (screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
  }

  // 배경
  ctx.fillStyle = currentMap.bg;
  ctx.fillRect(0, 0, W, H);

  // 패턴
  if (mapName === 'Space') {
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 80; i++) {
      const x = (i * 173) % W, y = (i * 257) % H;
      ctx.globalAlpha = 0.2 + Math.sin(performance.now()/600 + i) * 0.3;
      ctx.fillRect(x, y, 1.5, 1.5);
    }
    ctx.globalAlpha = 1;
  } else {
    ctx.fillStyle = currentMap.accent;
    ctx.globalAlpha = 0.25;
    for (let i = 0; i < 60; i++) {
      const x = (i * 137) % W, y = (i * 211) % H;
      ctx.fillRect(x, y, 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  // 장애물
  for (const o of obstacles) {
    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    if (o.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(o.x + o.w/2 + 3, o.y + o.h/2 + 3, o.w/2, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillRect(o.x + 3, o.y + 3, o.w, o.h);
    }
    // 본체
    ctx.fillStyle = currentMap.obs;
    if (o.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(o.x + o.w/2, o.y + o.h/2, o.w/2, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillRect(o.x, o.y, o.w, o.h);
    }
  }

  // 엔티티
  const all = [player, ...bots];
  for (const e of all) {
    if (e.dead) continue;
    drawEntity(e);
  }

  // 총알
  for (const b of bullets) {
    if (b.isAoe) {
      // 깜빡임 (퓨즈)
      const flash = Math.sin(performance.now() / 80) > 0;
      ctx.fillStyle = flash ? '#ff4444' : '#5b5';
      ctx.beginPath();
      ctx.arc(b.x, b.y, 6, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillStyle = b.color;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  // 파티클
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // 사망 오버레이 (흔들림 영향 X)
  if (player.dead) {
    ctx.fillStyle = 'rgba(10,5,20,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px "Black Han Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('💀 사망', W/2, H/2);
    const remain = Math.max(0, Math.ceil((player.respawnAt - performance.now()) / 1000));
    ctx.font = '20px "IBM Plex Sans KR", sans-serif';
    ctx.fillStyle = '#ffd23f';
    ctx.fillText(`${remain}초 후 부활`, W/2, H/2 + 38);
    ctx.textAlign = 'start';
  }

  drawHUD();
}

function drawEntity(e) {
  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(e.x, e.y + e.radius - 1, e.radius * 0.9, e.radius * 0.4, 0, 0, Math.PI*2);
  ctx.fill();

  // 체력바
  const hpPct = Math.max(0, e.hp / e.maxHp);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(e.x - 19, e.y - e.radius - 13, 38, 6);
  ctx.fillStyle = e.team === 'blue' ? '#3ddfff' : '#ff4444';
  ctx.fillRect(e.x - 18, e.y - e.radius - 12, 36 * hpPct, 4);

  // 본체
  let bodyCol;
  if (e === player) bodyCol = '#4d9fff';
  else if (e.team === 'blue') bodyCol = '#2a7ec2';
  else bodyCol = '#c43838';
  ctx.fillStyle = bodyCol;
  ctx.beginPath();
  ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2);
  ctx.fill();

  // 외곽선 (You는 강조)
  if (e === player) {
    ctx.strokeStyle = '#ffd23f';
    ctx.lineWidth = 2.5;
    ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // 무기 방향
  ctx.strokeStyle = '#15151f';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(e.x, e.y);
  ctx.lineTo(e.x + Math.cos(e.angle) * (e.radius + 10), e.y + Math.sin(e.angle) * (e.radius + 10));
  ctx.stroke();
  if (e.activeWeapon) {
    ctx.fillStyle = WEAPONS[e.activeWeapon].col;
    ctx.beginPath();
    ctx.arc(e.x + Math.cos(e.angle) * (e.radius + 12), e.y + Math.sin(e.angle) * (e.radius + 12), 3.5, 0, Math.PI*2);
    ctx.fill();
  }

  // 이름
  ctx.fillStyle = e === player ? '#ffd23f' : (e.team === 'blue' ? '#cef' : '#fdc');
  ctx.font = 'bold 11px "IBM Plex Sans KR", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(e === player ? 'You' : e.name, e.x, e.y - e.radius - 16);
  ctx.textAlign = 'start';
}

function drawHUD() {
  const blueK = teamKills('blue');
  const redK = teamKills('red');
  const remain = Math.max(0, EVENT_INTERVAL - (performance.now() - lastEventTime));
  hud.innerHTML = `
    <div class="hud-box">
      <div>❤️ ${Math.max(0, Math.ceil(player.hp))}/${player.maxHp}</div>
      <div class="hp-bar"><div class="hp-fill" style="width:${100*Math.max(0,player.hp)/player.maxHp}%"></div></div>
      <div style="margin-top:8px">🗝️ ${totalKeys} &nbsp;·&nbsp; 💥 ${player.kills}킬</div>
    </div>
    <div class="hud-box" style="text-align:center">
      <div class="score"><span class="blue">${blueK}</span><span class="sep">:</span><span class="red">${redK}</span></div>
      <div style="font-size:10px;color:#888;margin-top:4px;letter-spacing:1px;font-family:'Press Start 2P',monospace">FIRST TO ${WIN_KILLS}</div>
      <div style="font-size:11px;color:var(--neon-yellow);margin-top:6px">🎁 이벤트 ${Math.ceil(remain/1000)}초</div>
    </div>
    <div class="hud-box" style="text-align:right">
      <div>🗺️ ${currentMap.ko}</div>
      <div style="font-size:10px;color:#888;margin-top:6px;line-height:1.6">WASD · 마우스 · 1~4</div>
    </div>
  `;
  renderWeaponsBar();
}

function renderWeaponsBar() {
  if (!player) return;
  const html = player.weapons.map((w, i) => {
    const wp = WEAPONS[w];
    let stat;
    if (wp.kind === 'heal') stat = '회복';
    else if (wp.kind === 'melee') stat = '근접';
    else if (wp.kind === 'aoe') stat = 'AOE';
    else stat = `D${wp.dmg}`;
    return `<div class="weapon-slot ${i === activeSlot ? 'active' : ''}">
      <span class="key">${i+1}</span>
      <div class="nm" style="color:${wp.col}">${wp.ko}</div>
      <div class="stat">${stat}</div>
    </div>`;
  }).join('');
  weaponsBar.innerHTML = html;
}

function showEventBanner(text) {
  const div = document.createElement('div');
  div.className = 'event-banner';
  div.textContent = text;
  stage.appendChild(div);
  setTimeout(() => div.remove(), 2500);
}

function triggerEvent() {
  const w = EVENT_WEAPONS[Math.floor(Math.random() * EVENT_WEAPONS.length)];
  player.weapons[3] = w;
  if (activeSlot === 3) player.activeWeapon = w;
  bots.forEach(b => { b.weapons[3] = w; });
  showEventBanner(`🎁 이벤트! ${WEAPONS[w].ko} 지급`);
  renderWeaponsBar();
}

function endMatch(won) {
  state = won ? 'victory' : 'defeat';
  const reward = won ? 2 : 0;
  totalKeys += reward;
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h1 class="title" style="background:linear-gradient(180deg,#fff,${won?'var(--neon-yellow)':'var(--neon-red)'});-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">
      ${won ? '🏆 승리' : '💀 패배'}
    </h1>
    <div class="subtitle" style="color:${won?'var(--neon-yellow)':'var(--neon-red)'}">${won ? 'Victory' : 'Defeat'}</div>
    <p class="desc">개인 ${player.kills}킬 ${won ? `· 보상 +${reward} 🗝️` : ''}</p>
    <div class="key-display" style="margin:12px 0">보유 🗝️ ${totalKeys}</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <button class="btn" id="againBtn">다시 시작</button>
      <button class="btn alt" id="menuBtn">메뉴로</button>
    </div>
  `;
  document.getElementById('againBtn').onclick = goLoadout;
  document.getElementById('menuBtn').onclick = showMenu;
}

// ============================================================
// 입력
// ============================================================
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (state === 'playing' && !player.dead) {
    if (['1','2','3','4'].includes(e.key)) {
      const idx = parseInt(e.key) - 1;
      if (idx < player.weapons.length) {
        activeSlot = idx;
        player.activeWeapon = player.weapons[idx];
        renderWeaponsBar();
      }
    }
  }
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  mouseX = (e.clientX - r.left) * (W / r.width);
  mouseY = (e.clientY - r.top) * (H / r.height);
});
cv.addEventListener('mousedown', () => mouseDown = true);
cv.addEventListener('mouseup', () => mouseDown = false);
cv.addEventListener('mouseleave', () => mouseDown = false);
cv.addEventListener('contextmenu', e => e.preventDefault());

// 시작
showMenu();
</script>
</body>
</html>
