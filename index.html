<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>게임 선택</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      background: #121212;
      font-family: Arial, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      justify-content: space-evenly; /* 버튼 10개를 세로로 균등 배치 */
      height: 100%;
      width: 100%;
      max-width: 600px;              /* 가운데 정렬 느낌 */
      margin: auto;
      padding: 10px;
      box-sizing: border-box;
    }
    button {
      flex: 1;                       /* 각 버튼이 같은 비율로 높이 차지 */
      margin: 4px 0;                 /* 버튼 사이 간격 */
      font-size: 1.5rem;
      border: none;
      border-radius: 12px;
      background: #1e90ff;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background: #005bbb;
    }
  </style>
</head>
<body>
  <div class="container">
    <button onclick="location.href='1.html'">스피드숫자</button>
    <button onclick="location.href='2.html'">팩맨</button>
    <button onclick="location.href='http://34.169.81.154:8080/3.html'">그림판</button>
    <button onclick="location.href='4.html'">암산</button>
    <button onclick="location.href='5.html'">성경말씀</button>
    <button onclick="location.href='http://34.169.81.154:3000/6.html'">대포</button>
    <button onclick="location.href='7.html'">암기력</button>
    <button onclick="location.href='8.html'">영어를 잡아라</button>
    <button onclick="location.href='9.html'">비행기</button>
    <button onclick="location.href='10.html'">테트리스</button>
    <button onclick="location.href='11.html'">영어발음</button>
    <button onclick="location.href='http://34.169.81.154:3001/11.html'">영어발음</button>
  </div>
</body>
</html>
