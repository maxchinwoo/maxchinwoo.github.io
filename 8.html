    let quizWords = [];
    let remainingWords = [];
    let answer = null;
    let started = false;

    // ✅ 음성 출력
    function speak(text, lang) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      window.speechSynthesis.speak(utterance);
    }

    // ✅ 게임 시작 버튼
    function startGame() {
      started = true;
      stage = 1;
      startStage();
    }

    // ✅ 단계 시작
    function startStage() {
      document.getElementById("stage").innerText = stage + " 단계";
      document.getElementById("options").innerHTML = "";
      document.getElementById("message").innerText = "";
      document.getElementById("nextStageBtn").style.display = "none";

      // 4개 단어 무작위 선택
      quizWords = [];
      while (quizWords.length < 4) {
        const candidate = words[Math.floor(Math.random() * words.length)];
        if (!quizWords.includes(candidate)) {
          quizWords.push(candidate);
        }
      }
      remainingWords = [...quizWords]; // 이번 단계에서 아직 맞추지 않은 단어들

      // 단어 보여주기 (한글 → 영어)
      let i = 0;
      function showNextWord() {
        if (i >= quizWords.length) {
          setTimeout(showQuiz, 2000); // 마지막 단어 끝나고 퀴즈 시작
          return;
        }
        const w = quizWords[i];
        // 한글 먼저
        document.getElementById("question").innerText = w.meaning;
        speak(w.meaning, "ko-KR");
        // 2초 후 영어 표시 & 읽기
        setTimeout(() => {
          document.getElementById("question").innerText = w.meaning + " - " + w.word;
          speak(w.word, "en-US");
        }, 2000);
        // 4초 후 다음 단어
        setTimeout(() => {
          i++;
          showNextWord();
        }, 4000);
      }
      showNextWord();
    }

    // ✅ 퀴즈 표시
    function showQuiz() {
      if (remainingWords.length === 0) {
        // 4개 다 맞추면 다음 단계로
        speak(stage + "단계 통과하셨습니다", "ko-KR");
        document.getElementById("message").innerText = "🎉 " + stage + "단계 통과!";
        document.getElementById("nextStageBtn").style.display = "inline-block";
        return;
      }

      // 이번에 맞출 문제: remainingWords 중 하나
      answer = remainingWords[Math.floor(Math.random() * remainingWords.length)];
      document.getElementById("question").innerText = "❓ " + answer.meaning;
      speak(answer.meaning, "ko-KR");

      // 보기: 영어 단어 4개
      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";
      quizWords.forEach(w => {
        const btn = document.createElement("button");
        btn.innerText = w.word;
        btn.onclick = () => checkAnswer(w);
        optionsDiv.appendChild(btn);
      });
    }

    // ✅ 정답 체크
    function checkAnswer(choice) {
      if (choice.word === answer.word) {
        document.getElementById("message").innerText = "✅ 정답!";
        // 맞춘 단어는 제거
        remainingWords = remainingWords.filter(w => w.word !== answer.word);
        setTimeout(showQuiz, 1000);
      } else {
        document.getElementById("message").innerText = "❌ 틀렸습니다. 다시 시도하세요.";
        setTimeout(showQuiz, 1500);
      }
    }

    // ✅ 다음 단계 버튼
    function nextStage() {
      stage++;
      if (stage > 10) {
        document.getElementById("question").innerText = "🎉 성공! 10단계 완료!";
        document.getElementById("options").innerHTML = "";
        document.getElementById("message").innerText = "";
        document.getElementById("nextStageBtn").style.display = "none";
      } else {
        startStage();
      }
    }

    // ✅ 리셋
    function resetGame() {
      stage = 1;
      started = false;
      document.getElementById("stage").innerText = "시작 전";
      document.getElementById("question").innerText = "▶ 시작 버튼을 누르세요";
      document.getElementById("options").innerHTML = "";
      document.getElementById("message").innerText = "";
      document.getElementById("nextStageBtn").style.display = "none";
    }

    // ✅ 홈으로
    function goHome() {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
