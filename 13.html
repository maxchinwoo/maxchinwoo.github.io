<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Practice Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <header class="top-bar">
            <!-- <button class="nav-btn">
                <span class="icon">←</span> 타자 연습으로 돌아가기
            </button> -->
            <div class="header-right">
                <div class="lang-toggle">
                    <button class="lang-btn active" data-lang="ko">한국어</button>
                    <button class="lang-btn" data-lang="en">ENG</button>
                </div>
            </div>
        </header>

        <div class="main-layout">
            <!-- Center: Game Area -->
            <main class="game-area">
                <div class="sentence-section">
                    <div class="current-sentence-box">
                        <div class="current-text" id="current-text"></div>
                    </div>

                    <div class="input-container">
                        <input type="text" id="game-input" autocomplete="off" placeholder="위 문장을 입력하세요" autofocus>
                        <!-- <div class="input-highlight" id="input-highlight"></div> -->
                    </div>

                    <div class="next-sentences" id="next-sentences">
                        <!-- Next sentences -->
                        <div class="next-item">...</div>
                        <div class="next-item">...</div>
                        <div class="next-item">...</div>
                    </div>
                </div>

                <div class="keyboard-wrapper">
                    <div class="keyboard-controls">
                        <div class="stats-mini">
                            <span>타수: <strong id="cpm-display">0</strong></span>
                            <span>정확도: <strong id="accuracy-display">100%</strong></span>
                            <span>시간: <strong id="time-display">60</strong></span>
                        </div>
                        <span class="control-help">도전단계</span>
                    </div>
                    <div class="virtual-keyboard" id="virtual-keyboard">
                        <!-- Keyboard rows generated by JS -->
                    </div>
                </div>

                <!-- Result Modal (Hidden by default) -->
                <div class="result-overlay hidden" id="result-modal">
                    <div class="result-card">
                        <h2>게임 종료!</h2>
                        <div class="final-score">
                            <div class="score-item">
                                <span>총 타수</span>
                                <strong id="final-cpm">0</strong>
                            </div>
                            <div class="score-item">
                                <span>정확도</span>
                                <strong id="final-acc">0%</strong>
                            </div>
                        </div>
                        <button class="restart-btn" id="restart-btn">다시 시작</button>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>

</html>
